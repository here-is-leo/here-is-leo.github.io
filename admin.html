<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>داشبورد مدیریت</title>
  <link rel="icon" href="logo.png">
  <link rel="stylesheet" href="style.css">
  <style>
    /* استایل‌های لاگین */
    .login-container {
      max-width: 400px;
      margin: 100px auto;
      padding: 40px;
      background: var(--background-elevated);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-default);
    }
    
    .login-container h1 {
      text-align: center;
      margin-bottom: 8px;
    }
    
    .login-container p {
      text-align: center;
      color: var(--foreground-muted);
      margin-bottom: 24px;
    }
    
    .form-group {
      margin-bottom: 16px;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 6px;
      color: var(--foreground-muted);
    }
    
    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid var(--border-default);
      background: var(--surface);
      color: var(--foreground);
      font-family: inherit;
      font-size: 0.95rem;
    }
    
    .form-group input:focus {
      outline: none;
      border-color: var(--accent);
    }
    
    .login-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s;
    }
    
    .login-btn:hover {
      background: var(--accent-bright);
      transform: translateY(-2px);
    }
    
    .error-msg {
      color: #ff6b6b;
      text-align: center;
      margin-top: 12px;
      display: none;
    }
    
    /* داشبورد */
    .dashboard {
      display: none;
    }
    
    .dash-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 0;
      border-bottom: 1px solid var(--border-default);
      margin-bottom: 30px;
    }
    
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 30px;
    }
    
    .stat-card {
      background: var(--background-elevated);
      border: 1px solid var(--border-default);
      border-radius: var(--radius);
      padding: 20px;
      text-align: center;
    }
    
    .stat-card .number {
      font-size: 2rem;
      font-weight: 700;
      color: #b8bfff;
    }
    
    .stat-card .label {
      color: var(--foreground-muted);
      font-size: 0.8rem;
    }
    
    .table-wrap {
      background: var(--background-elevated);
      border: 1px solid var(--border-default);
      border-radius: var(--radius);
      padding: 20px;
      overflow-x: auto;
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
    }
    
    th, td {
      padding: 12px;
      text-align: right;
      border-bottom: 1px solid var(--border-default);
    }
    
    th {
      color: var(--foreground-muted);
      font-size: 0.8rem;
    }
    
    .status-badge {
      padding: 3px 12px;
      border-radius: 20px;
      font-size: 0.7rem;
      display: inline-block;
    }
    
    .status-pending { background: #fff3cd; color: #856404; }
    .status-confirmed { background: #d4edda; color: #155724; }
    .status-cancelled { background: #f8d7da; color: #721c24; }
    
    .logout-btn {
      padding: 8px 20px;
      border: 1px solid var(--border-default);
      border-radius: 8px;
      background: transparent;
      color: var(--foreground-muted);
      cursor: pointer;
    }
    
    .logout-btn:hover {
      border-color: var(--border-hover);
      color: var(--foreground);
    }
  </style>
</head>
<body data-page="admin">
  <div class="bg-ambient">
    <div class="orb"></div>
    <div class="orb"></div>
    <div class="orb"></div>
  </div>

  <!-- ====== لاگین ====== -->
  <div id="loginPage" class="container">
    <div class="login-container">
      <h1>🌸 مدیریت قرارها</h1>
      <p>برای مشاهده دعوت‌ها وارد شوید</p>
      
      <form id="loginForm">
        <div class="form-group">
          <label>نام کاربری</label>
          <input type="text" id="username" value="admin" required>
        </div>
        <div class="form-group">
          <label>رمز عبور</label>
          <input type="password" id="password" required>
        </div>
        <button type="submit" class="login-btn">ورود به داشبورد ✦</button>
        <div id="loginError" class="error-msg"></div>
      </form>
    </div>
  </div>

  <!-- ====== داشبورد ====== -->
  <div id="dashboard" class="container dashboard">
    <div class="dash-header">
      <div>
        <h1>🌸 قرارهای صورتی</h1>
        <span style="color:var(--foreground-muted);font-size:0.85rem;">مدیریت دعوت‌ها</span>
      </div>
      <div>
        <span style="color:var(--foreground-muted);margin-right:16px;">👤 ادمین</span>
        <button class="logout-btn" onclick="logout()">خروج</button>
      </div>
    </div>

    <!-- آمار -->
    <div class="stats-grid" id="statsGrid">
      <div class="stat-card">
        <div class="number" id="totalCount">0</div>
        <div class="label">مجموع دعوت‌ها</div>
      </div>
      <div class="stat-card">
        <div class="number" id="pendingCount">0</div>
        <div class="label">در انتظار</div>
      </div>
      <div class="stat-card">
        <div class="number" id="confirmedCount">0</div>
        <div class="label">تأیید شده</div>
      </div>
      <div class="stat-card">
        <div class="number" id="yesCount">0</div>
        <div class="label">پاسخ مثبت</div>
      </div>
    </div>

    <!-- لیست دعوت‌ها -->
    <div class="table-wrap">
      <h2>📋 لیست دعوت‌ها</h2>
      <div id="invitationsList">
        <p style="text-align:center;color:var(--foreground-muted);padding:40px 0;">⏳ در حال بارگذاری...</p>
      </div>
    </div>
  </div>

  <script>
    // ============================================================
    // تنظیمات - آدرس Worker شما
    // ============================================================
    const API_URL = 'https://your-worker.workers.dev'; // ← این رو عوض کن
    
    // ============================================================
    // بررسی توکن ذخیره شده
    // ============================================================
    const token = localStorage.getItem('adminToken');
    if (token) {
      document.getElementById('loginPage').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      loadDashboard();
    }
    
    // ============================================================
    // لاگین
    // ============================================================
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const error = document.getElementById('loginError');
      
      error.style.display = 'none';
      
      try {
        const response = await fetch(`${API_URL}/api/admin/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        
        const data = await response.json();
        
        if (data.success) {
          localStorage.setItem('adminToken', data.token);
          document.getElementById('loginPage').style.display = 'none';
          document.getElementById('dashboard').style.display = 'block';
          loadDashboard();
        } else {
          error.textContent = data.message || 'نام کاربری یا رمز عبور اشتباه است';
          error.style.display = 'block';
        }
      } catch {
        error.textContent = 'خطا در ارتباط با سرور';
        error.style.display = 'block';
      }
    });
    
    // ============================================================
    // خروج
    // ============================================================
    function logout() {
      localStorage.removeItem('adminToken');
      document.getElementById('loginPage').style.display = 'block';
      document.getElementById('dashboard').style.display = 'none';
    }
    
    // ============================================================
    // بارگذاری داشبورد
    // ============================================================
    async function loadDashboard() {
      const token = localStorage.getItem('adminToken');
      if (!token) return;
      
      try {
        await loadStats(token);
        await loadInvitations(token);
      } catch (error) {
        if (error.message === 'Unauthorized') {
          logout();
        }
      }
    }
    
    // ============================================================
    // دریافت آمار
    // ============================================================
    async function loadStats(token) {
      const response = await fetch(`${API_URL}/api/admin/stats`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      
      if (response.status === 401) throw new Error('Unauthorized');
      
      const data = await response.json();
      
      document.getElementById('totalCount').textContent = data.total || 0;
      document.getElementById('pendingCount').textContent = data.pending || 0;
      document.getElementById('confirmedCount').textContent = data.confirmed || 0;
      document.getElementById('yesCount').textContent = data.yesCount || 0;
    }
    
    // ============================================================
    // دریافت لیست دعوت‌ها
    // ============================================================
    async function loadInvitations(token) {
      const response = await fetch(`${API_URL}/api/admin/invitations`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      
      if (response.status === 401) throw new Error('Unauthorized');
      
      const invitations = await response.json();
      renderTable(invitations);
    }
    
    // ============================================================
    // نمایش جدول
    // ============================================================
    function renderTable(invitations) {
      const container = document.getElementById('invitationsList');
      
      if (!invitations || invitations.length === 0) {
        container.innerHTML = `<p style="text-align:center;color:var(--foreground-muted);padding:40px 0;">📭 هنوز هیچ دعوتی ثبت نشده است</p>`;
        return;
      }
      
      let html = `
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>مکان</th>
              <th>تاریخ</th>
              <th>ساعت</th>
              <th>وضعیت</th>
              <th>IP</th>
              <th>زمان ثبت</th>
            </tr>
          </thead>
          <tbody>
      `;
      
      invitations.forEach((inv, i) => {
        const statusClass = {
          'pending': 'status-pending',
          'confirmed': 'status-confirmed',
          'cancelled': 'status-cancelled'
        }[inv.status] || 'status-pending';
        
        const statusText = {
          'pending': 'در انتظار',
          'confirmed': 'تأیید شده',
          'cancelled': 'لغو شده'
        }[inv.status] || 'در انتظار';
        
        html += `
          <tr>
            <td>${i + 1}</td>
            <td>${inv.place || '-'}</td>
            <td>${inv.date || '-'}</td>
            <td>${inv.time || '-'}</td>
            <td><span class="status-badge ${statusClass}">${statusText}</span></td>
            <td>${inv.ipAddress || '-'}</td>
            <td>${formatDate(inv.createdAt)}</td>
          </tr>
        `;
      });
      
      html += `</tbody></table>`;
      container.innerHTML = html;
    }
    
    // ============================================================
    // تاریخ شمسی
    // ============================================================
    function formatDate(dateStr) {
      if (!dateStr) return '-';
      const d = new Date(dateStr);
      return d.toLocaleDateString('fa-IR', {
        year: 'numeric',
        month: 'long',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });
    }
  </script>
</body>
</html>
