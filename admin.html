<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>داشبورد مدیریت | ایلیا فراهانی</title>
  <link rel="icon" href="logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;900&family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    body { padding: 60px 0 40px; }

    .login-container {
      max-width: 420px;
      margin: 60px auto;
      padding: 44px 36px;
      background: var(--card-bg);
      border: var(--bw) solid var(--border);
      box-shadow:
        10px 10px 0 0 var(--bh-red),
        20px 20px 0 0 var(--bh-yellow);
    }
    .login-container h1 {
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 900;
      text-transform: uppercase;
      text-align: center;
      margin: 0 0 10px;
      color: var(--fg);
    }
    .login-container > p {
      text-align: center;
      color: var(--fg-muted);
      margin: 0 0 30px;
      font-size: .92rem;
    }

    .form-group { margin-bottom: 22px; }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: var(--fg-muted);
      font-family: var(--font-display);
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .form-group input {
      width: 100%;
      padding: 14px 16px;
      border: var(--bw-sm) solid var(--border);
      background: transparent;
      color: var(--fg);
      font-family: inherit;
      font-size: .96rem;
      transition: border-color var(--motion), box-shadow var(--motion);
    }
    .form-group input:focus {
      outline: none;
      border-color: var(--bh-red);
      box-shadow: 4px 4px 0 0 var(--bh-red);
    }

    .login-btn {
      width: 100%;
      padding: 16px;
      border: var(--bw-sm) solid var(--bh-black);
      background: var(--bh-red);
      color: var(--bh-white);
      font-family: var(--font-display);
      font-weight: 900;
      font-size: .86rem;
      letter-spacing: .14em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 5px 5px 0 0 var(--bh-black);
      transition: transform var(--motion), box-shadow var(--motion);
    }
    .login-btn:hover {
      transform: translate(-3px, -3px);
      box-shadow: 8px 8px 0 0 var(--bh-black);
    }
    .login-btn:active {
      transform: translate(2px, 2px);
      box-shadow: none;
    }

    .error-msg {
      color: var(--bh-red);
      text-align: center;
      margin-top: 16px;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: .82rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      display: none;
    }

    .dashboard { display: none; }

    .dash-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      padding: 26px 0;
      border-bottom: var(--bw-sm) solid var(--border);
      margin-bottom: 32px;
    }
    .dash-header h1 {
      font-family: var(--font-display);
      font-size: 1.4rem;
      font-weight: 900;
      text-transform: uppercase;
      margin: 0;
      letter-spacing: -0.02em;
    }
    .dash-header .sub {
      color: var(--fg-muted);
      font-size: .8rem;
      font-family: var(--font-display);
      letter-spacing: .1em;
      text-transform: uppercase;
      margin-top: 4px;
    }
    .dash-header .user-info {
      display: flex;
      align-items: center;
      gap: 14px;
      color: var(--fg-muted);
      font-family: var(--font-display);
      font-weight: 800;
      font-size: .78rem;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .logout-btn {
      padding: 10px 20px;
      border: var(--bw-sm) solid var(--border);
      background: transparent;
      color: var(--fg);
      font-family: var(--font-display);
      font-weight: 800;
      font-size: .74rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all var(--motion);
    }
    .logout-btn:hover {
      background: var(--bh-red);
      color: var(--bh-white);
      border-color: var(--bh-black);
      transform: translate(-2px, -2px);
      box-shadow: 4px 4px 0 0 var(--bh-black);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 18px;
      margin-bottom: 34px;
    }
    .stat-card {
      background: var(--card-bg);
      border: var(--bw-sm) solid var(--border);
      padding: 26px 20px;
      text-align: center;
      box-shadow: var(--shadow-md);
      transition: transform var(--motion), box-shadow var(--motion);
    }
    .stat-card:hover {
      transform: translate(-3px, -3px);
      box-shadow: var(--shadow-lg);
    }
    .stat-card .number {
      font-family: var(--font-display);
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--bh-red);
      line-height: 1;
      letter-spacing: -0.04em;
    }
    .stat-card .label {
      color: var(--fg-muted);
      font-family: var(--font-display);
      font-size: .68rem;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
      margin-top: 10px;
    }

    .table-wrap {
      background: var(--card-bg);
      border: var(--bw-sm) solid var(--border);
      padding: 28px 24px;
      box-shadow: var(--shadow-lg);
      overflow-x: auto;
    }
    .table-wrap h2 {
      font-family: var(--font-display);
      font-size: 1.1rem;
      font-weight: 900;
      text-transform: uppercase;
      margin: 0 0 20px;
      padding-bottom: 12px;
      border-bottom: var(--bw-sm) solid var(--border);
      letter-spacing: -0.01em;
    }

    table { width: 100%; border-collapse: collapse; }
    th, td {
      padding: 14px 16px;
      text-align: right;
      border-bottom: var(--bw-sm) solid var(--border);
      font-size: .88rem;
    }
    th {
      font-family: var(--font-display);
      font-size: .7rem;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--fg-muted);
      background: var(--bg-section);
    }

    .status-badge {
      padding: 5px 14px;
      font-family: var(--font-display);
      font-size: .66rem;
      font-weight: 800;
      letter-spacing: .1em;
      text-transform: uppercase;
      display: inline-block;
      border: var(--bw-sm) solid var(--bh-black);
    }
    .status-pending   { background: var(--bh-yellow); color: var(--bh-black); }
    .status-confirmed { background: var(--bh-blue); color: var(--bh-white); }
    .status-cancelled { background: var(--bh-red); color: var(--bh-white); }

    .empty-state {
      text-align: center;
      color: var(--fg-muted);
      padding: 48px 20px;
      font-family: var(--font-display);
      font-weight: 800;
      letter-spacing: .1em;
      text-transform: uppercase;
      font-size: .82rem;
    }
  </style>

  <!-- ====== BLOCKING STYLESHEET RESOLVER (prevents FOUC) ====== -->
  <script>
  (function () {
    var design = 'classic';
    try { design = localStorage.getItem('site-design') || 'classic'; } catch (e) {}
    if (design !== 'bauhaus' && design !== 'classic') design = 'classic';
    var file = design === 'bauhaus' ? 'style.css' : 'style-classic.css';
    document.documentElement.setAttribute('data-design', design);
    document.write('<link rel="stylesheet" href="' + file + '" id="site-stylesheet">');
  })();
  </script>

  <!-- ====== DESIGN SWITCHER (user clicks only) ====== -->
  <script src="design-switcher.js" defer></script>
</head>
<body data-page="admin">
  <div id="loginPage" class="container">
    <div class="login-container">
      <h1>ورود مدیر</h1>
      <p>برای مشاهده دعوت‌ها وارد شوید</p>
      <form id="loginForm">
        <div class="form-group">
          <label for="username">نام کاربری</label>
          <input type="text" id="username" value="admin" required autocomplete="username">
        </div>
        <div class="form-group">
          <label for="password">رمز عبور</label>
          <input type="password" id="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="login-btn">ورود به داشبورد</button>
        <div id="loginError" class="error-msg"></div>
      </form>
    </div>
  </div>

  <div id="dashboard" class="container dashboard">
    <div class="dash-header">
      <div>
        <h1>مدیریت قرارها</h1>
        <div class="sub">داشبورد دعوت‌ها</div>
      </div>
      <div class="user-info">
        <span>👤 ادمین</span>
        <button class="logout-btn" onclick="logout()">خروج</button>
      </div>
    </div>

    <div class="stats-grid" id="statsGrid">
      <div class="stat-card"><div class="number" id="totalCount">0</div><div class="label">مجموع دعوت‌ها</div></div>
      <div class="stat-card"><div class="number" id="pendingCount">0</div><div class="label">در انتظار</div></div>
      <div class="stat-card"><div class="number" id="confirmedCount">0</div><div class="label">تأیید شده</div></div>
      <div class="stat-card"><div class="number" id="yesCount">0</div><div class="label">پاسخ مثبت</div></div>
    </div>

    <div class="table-wrap">
      <h2>لیست دعوت‌ها</h2>
      <div id="invitationsList">
        <p class="empty-state">در حال بارگذاری…</p>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'https://date.here-is-leo.ir';

    const token = localStorage.getItem('adminToken');
    if (token) {
      document.getElementById('loginPage').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      loadDashboard();
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const error = document.getElementById('loginError');
      error.style.display = 'none';

      try {
        const response = await fetch(`${API_URL}/api/admin/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await response.json();

        if (data.success) {
          localStorage.setItem('adminToken', data.token);
          document.getElementById('loginPage').style.display = 'none';
          document.getElementById('dashboard').style.display = 'block';
          loadDashboard();
        } else {
          error.textContent = data.message || 'نام کاربری یا رمز عبور اشتباه است';
          error.style.display = 'block';
        }
      } catch {
        error.textContent = 'خطا در ارتباط با سرور';
        error.style.display = 'block';
      }
    });

    function logout() {
      localStorage.removeItem('adminToken');
      document.getElementById('loginPage').style.display = 'block';
      document.getElementById('dashboard').style.display = 'none';
    }

    async function loadDashboard() {
      const token = localStorage.getItem('adminToken');
      if (!token) return;
      try {
        await loadStats(token);
        await loadInvitations(token);
      } catch (error) {
        if (error.message === 'Unauthorized') logout();
      }
    }

    async function loadStats(token) {
      const response = await fetch(`${API_URL}/api/admin/stats`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if (response.status === 401) throw new Error('Unauthorized');
      const data = await response.json();
      document.getElementById('totalCount').textContent = data.total || 0;
      document.getElementById('pendingCount').textContent = data.pending || 0;
      document.getElementById('confirmedCount').textContent = data.confirmed || 0;
      document.getElementById('yesCount').textContent = data.yesCount || 0;
    }

    async function loadInvitations(token) {
      const response = await fetch(`${API_URL}/api/admin/invitations`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if (response.status === 401) throw new Error('Unauthorized');
      const invitations = await response.json();
      renderTable(invitations);
    }

    function renderTable(invitations) {
      const container = document.getElementById('invitationsList');
      if (!invitations || invitations.length === 0) {
        container.innerHTML = `<p class="empty-state">هنوز هیچ دعوتی ثبت نشده است</p>`;
        return;
      }

      let html = `<table><thead><tr>
        <th>#</th><th>مکان</th><th>تاریخ</th><th>ساعت</th>
        <th>وضعیت</th><th>IP</th><th>زمان ثبت</th>
      </tr></thead><tbody>`;
      invitations.forEach((inv, i) => {
        const statusClass = {
          'pending': 'status-pending',
          'confirmed': 'status-confirmed',
          'cancelled': 'status-cancelled'
        }[inv.status] || 'status-pending';
        const statusText = {
          'pending': 'در انتظار',
          'confirmed': 'تأیید شده',
          'cancelled': 'لغو شده'
        }[inv.status] || 'در انتظار';
        html += `<tr>
          <td>${i + 1}</td>
          <td>${inv.place || '-'}</td>
          <td>${inv.date || '-'}</td>
          <td>${inv.time || '-'}</td>
          <td><span class="status-badge ${statusClass}">${statusText}</span></td>
          <td>${inv.ipAddress || '-'}</td>
          <td>${formatDate(inv.createdAt)}</td>
        </tr>`;
      });
      html += `</tbody></table>`;
      container.innerHTML = html;
    }

    function formatDate(dateStr) {
      if (!dateStr) return '-';
      const d = new Date(dateStr);
      return d.toLocaleDateString('fa-IR', {
        year: 'numeric', month: 'long', day: 'numeric',
        hour: '2-digit', minute: '2-digit'
      });
    }
  </script>
</body>
</html>
