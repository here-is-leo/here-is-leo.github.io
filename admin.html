<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>پنل مدیریت محتوا | ایلیا فراهانی</title>
<link rel="icon" href="logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#0a0a0c; --bg-2:#0f0f13; --card:#14141a; --card-2:#1a1a22;
  --border:rgba(255,255,255,.07); --border-2:rgba(255,255,255,.14);
  --fg:#EDEDEF; --fg-2:#9ca0aa; --fg-3:#5c5f68;
  --accent:#5E6AD2; --accent-2:#7c85e0; --accent-soft:rgba(94,106,210,.15);
  --danger:#ef4444; --danger-soft:rgba(239,68,68,.12);
  --success:#10b981; --success-soft:rgba(16,185,129,.12);
  --warn:#f59e0b; --warn-soft:rgba(245,158,11,.12);
  --radius:12px; --radius-sm:8px; --radius-lg:16px;
  --sidebar:260px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Vazirmatn',system-ui,sans-serif;
  background:var(--bg); color:var(--fg);
  line-height:1.6; -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.18)}

/* ============ LOGIN ============ */
.login-wrap{
  position:fixed;inset:0;display:grid;place-items:center;
  background:radial-gradient(ellipse at 50% 30%,#141828 0,#0a0a0c 60%);
  z-index:100;padding:20px;
}
.login-box{
  width:100%;max-width:400px;padding:40px 34px;
  background:var(--card); border:1px solid var(--border);
  border-radius:var(--radius-lg);
  box-shadow:0 30px 80px rgba(0,0,0,.5), 0 0 0 1px rgba(94,106,210,.15);
}
.login-logo{
  width:60px;height:60px;margin:0 auto 20px;
  border-radius:16px; display:grid;place-items:center;
  background:linear-gradient(135deg,var(--accent),#8b7fe0);
  box-shadow:0 10px 30px rgba(94,106,210,.35);
}
.login-logo svg{width:30px;height:30px;stroke:#fff;fill:none;stroke-width:2}
.login-box h1{font-size:20px;font-weight:800;text-align:center;margin-bottom:6px}
.login-box > p{font-size:13px;color:var(--fg-2);text-align:center;margin-bottom:28px}
.login-field{margin-bottom:16px}
.login-field label{display:block;font-size:12px;font-weight:600;color:var(--fg-2);margin-bottom:6px}
.login-field input{
  width:100%;padding:12px 14px;background:var(--bg-2);
  border:1px solid var(--border-2);border-radius:var(--radius-sm);
  font-size:14px;outline:none;transition:border-color .2s;
}
.login-field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.login-btn{
  width:100%;padding:13px;background:var(--accent);color:#fff;
  border-radius:var(--radius-sm);font-weight:700;font-size:14px;
  transition:all .2s;margin-top:8px;
}
.login-btn:hover{background:var(--accent-2);transform:translateY(-1px);box-shadow:0 10px 24px rgba(94,106,210,.3)}
.login-err{
  color:var(--danger);font-size:12px;text-align:center;margin-top:14px;
  min-height:18px;font-weight:600;
}

/* ============ LAYOUT ============ */
.layout{display:grid;grid-template-columns:var(--sidebar) 1fr;height:100vh;overflow:hidden}
.sidebar{
  background:var(--bg-2); border-left:1px solid var(--border);
  display:flex;flex-direction:column;height:100vh;overflow:hidden;
}
.brand{
  display:flex;align-items:center;gap:12px;padding:22px 20px;
  border-bottom:1px solid var(--border);flex-shrink:0;
}
.brand-logo{
  width:38px;height:38px;border-radius:10px;
  background:linear-gradient(135deg,var(--accent),#8b7fe0);
  display:grid;place-items:center;flex-shrink:0;
}
.brand-logo svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2}
.brand-info h3{font-size:14px;font-weight:700}
.brand-info p{font-size:11px;color:var(--fg-3)}

.nav-scroll{flex:1;overflow-y:auto;padding:14px 12px}
.nav-section{margin-bottom:20px}
.nav-section-title{
  font-size:10px;font-weight:700;color:var(--fg-3);
  text-transform:uppercase;letter-spacing:.1em;
  padding:6px 10px;margin-bottom:4px;
}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 12px;border-radius:var(--radius-sm);
  color:var(--fg-2);font-size:13.5px;font-weight:500;
  transition:all .15s;cursor:pointer;width:100%;text-align:right;
}
.nav-item:hover{background:var(--card);color:var(--fg)}
.nav-item.active{background:var(--accent-soft);color:var(--accent-2);font-weight:600}
.nav-item svg{width:16px;height:16px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:2}
.nav-badge{
  margin-right:auto;font-size:10px;font-weight:700;
  padding:2px 7px;border-radius:10px;
  background:var(--card-2);color:var(--fg-2);
}
.nav-item.active .nav-badge{background:var(--accent);color:#fff}

.sidebar-footer{
  padding:14px 12px;border-top:1px solid var(--border);
  display:flex;flex-direction:column;gap:6px;flex-shrink:0;
}
.sidebar-footer button{
  display:flex;align-items:center;gap:8px;
  padding:8px 12px;border-radius:var(--radius-sm);
  color:var(--fg-2);font-size:12.5px;font-weight:500;
  transition:all .15s;text-align:right;
}
.sidebar-footer button:hover{background:var(--card);color:var(--fg)}
.sidebar-footer button svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.sidebar-footer .danger:hover{color:var(--danger);background:var(--danger-soft)}

.main{
  display:flex;flex-direction:column;height:100vh;overflow:hidden;
  background:var(--bg);
}
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 28px;border-bottom:1px solid var(--border);
  background:var(--bg-2);flex-shrink:0;gap:16px;flex-wrap:wrap;
}
.topbar-left h1{font-size:18px;font-weight:800}
.topbar-left p{font-size:12px;color:var(--fg-2);margin-top:2px}
.topbar-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.lang-switch{
  display:flex;gap:3px;padding:3px;background:var(--card);
  border-radius:10px;border:1px solid var(--border);
}
.lang-switch button{
  padding:6px 12px;border-radius:7px;font-size:12px;font-weight:700;
  color:var(--fg-2);transition:all .15s;
}
.lang-switch button.active{background:var(--accent);color:#fff}

.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:8px 14px;border-radius:var(--radius-sm);
  font-size:12.5px;font-weight:600;transition:all .15s;
  border:1px solid transparent;white-space:nowrap;
}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-2);transform:translateY(-1px);box-shadow:0 8px 20px rgba(94,106,210,.3)}
.btn-secondary{background:var(--card);color:var(--fg);border-color:var(--border-2)}
.btn-secondary:hover{background:var(--card-2);border-color:var(--border)}
.btn-danger{background:var(--danger-soft);color:var(--danger)}
.btn-danger:hover{background:var(--danger);color:#fff}
.btn-ghost{color:var(--fg-2)}
.btn-ghost:hover{color:var(--fg);background:var(--card)}
.btn-sm{padding:6px 10px;font-size:11.5px}

.content{
  flex:1;overflow-y:auto;padding:28px;
}
.content-inner{max-width:900px;margin:0 auto}

/* ============ CARDS / FORMS ============ */
.card{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:22px;margin-bottom:18px;
}
.card-title{
  font-size:14px;font-weight:700;margin-bottom:4px;
  display:flex;align-items:center;gap:8px;
}
.card-title svg{width:16px;height:16px;stroke:var(--accent-2);fill:none;stroke-width:2}
.card-desc{font-size:12px;color:var(--fg-2);margin-bottom:18px}

.field{margin-bottom:16px}
.field:last-child{margin-bottom:0}
.field label{
  display:block;font-size:12px;font-weight:600;color:var(--fg-2);
  margin-bottom:6px;
}
.field .hint{font-size:11px;color:var(--fg-3);margin-top:4px}
.field input[type="text"],
.field input[type="number"],
.field input[type="url"],
.field input[type="email"],
.field textarea,
.field select{
  width:100%;padding:10px 12px;background:var(--bg-2);
  border:1px solid var(--border-2);border-radius:var(--radius-sm);
  font-size:13.5px;outline:none;transition:all .15s;
  font-family:inherit;color:var(--fg);
}
.field input:focus,.field textarea:focus,.field select:focus{
  border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);
}
.field textarea{min-height:90px;resize:vertical;line-height:1.7}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}

/* ============ ARRAY LIST ============ */
.array-head{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;margin-bottom:14px;
}
.array-head h3{font-size:14px;font-weight:700}
.array-list{display:flex;flex-direction:column;gap:8px}
.array-item{
  display:flex;align-items:center;gap:12px;
  padding:12px 14px;background:var(--bg-2);
  border:1px solid var(--border);border-radius:var(--radius-sm);
  transition:all .15s;
}
.array-item:hover{border-color:var(--border-2);background:var(--card-2)}
.array-item-icon{
  width:36px;height:36px;border-radius:9px;
  background:var(--accent-soft);color:var(--accent-2);
  display:grid;place-items:center;font-size:16px;flex-shrink:0;
  font-weight:700;
}
.array-item-body{flex:1;min-width:0}
.array-item-title{
  font-size:13.5px;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.array-item-sub{
  font-size:11.5px;color:var(--fg-3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  margin-top:2px;
}
.array-item-actions{display:flex;gap:4px;flex-shrink:0}
.icon-btn{
  width:32px;height:32px;border-radius:8px;
  display:grid;place-items:center;color:var(--fg-2);
  transition:all .15s;
}
.icon-btn:hover{background:var(--card);color:var(--fg)}
.icon-btn.danger:hover{background:var(--danger-soft);color:var(--danger)}
.icon-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}

.empty{
  text-align:center;padding:40px 20px;color:var(--fg-3);
  font-size:13px;border:1px dashed var(--border-2);
  border-radius:var(--radius-sm);
}

/* ============ MODAL ============ */
.modal-back{
  position:fixed;inset:0;background:rgba(0,0,0,.7);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;
  z-index:200;padding:20px;
}
.modal-back.open{display:flex}
.modal{
  background:var(--card);border:1px solid var(--border-2);
  border-radius:var(--radius-lg);width:100%;max-width:560px;
  max-height:90vh;display:flex;flex-direction:column;
  box-shadow:0 30px 80px rgba(0,0,0,.6);
  animation:modalIn .2s ease-out;
}
@keyframes modalIn{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
.modal-head{
  padding:18px 22px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;
}
.modal-head h3{font-size:15px;font-weight:700}
.modal-body{padding:22px;overflow-y:auto;flex:1}
.modal-foot{
  padding:14px 22px;border-top:1px solid var(--border);
  display:flex;align-items:center;justify-content:flex-end;gap:8px;
  flex-shrink:0;
}

/* ============ DASHBOARD ============ */
.dash-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:14px;margin-bottom:24px;
}
.dash-stat{
  padding:18px;background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);
}
.dash-stat .num{
  font-size:26px;font-weight:800;color:var(--accent-2);
  line-height:1;margin-bottom:6px;
}
.dash-stat .lbl{font-size:12px;color:var(--fg-2)}
.dash-actions{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:10px;
}
.dash-action{
  display:flex;align-items:center;gap:12px;
  padding:14px;background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);cursor:pointer;text-align:right;
  transition:all .15s;
}
.dash-action:hover{border-color:var(--border-2);background:var(--card-2);transform:translateY(-2px)}
.dash-action-ic{
  width:38px;height:38px;border-radius:10px;
  background:var(--accent-soft);color:var(--accent-2);
  display:grid;place-items:center;flex-shrink:0;
}
.dash-action-ic svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
.dash-action h4{font-size:13px;font-weight:700}
.dash-action p{font-size:11px;color:var(--fg-3);margin-top:2px}

/* ============ TOAST ============ */
.toast{
  position:fixed;bottom:24px;left:50%;
  transform:translateX(-50%) translateY(20px);
  padding:10px 20px;background:var(--card);
  border:1px solid var(--border-2);border-radius:10px;
  font-size:13px;font-weight:600;color:var(--fg);
  box-shadow:0 12px 40px rgba(0,0,0,.5);
  opacity:0;pointer-events:none;transition:all .25s;
  z-index:300;display:flex;align-items:center;gap:8px;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{border-color:var(--success);color:var(--success)}
.toast.err{border-color:var(--danger);color:var(--danger)}

/* ============ TAG INPUT ============ */
.tag-input{
  display:flex;flex-wrap:wrap;gap:6px;padding:8px;
  background:var(--bg-2);border:1px solid var(--border-2);
  border-radius:var(--radius-sm);min-height:42px;
  align-items:center;
}
.tag-input input{
  flex:1;min-width:80px;padding:4px 6px;background:transparent;
  border:none;outline:none;font-size:13px;color:var(--fg);
}
.tag{
  display:inline-flex;align-items:center;gap:4px;
  padding:3px 8px;background:var(--accent-soft);color:var(--accent-2);
  border-radius:6px;font-size:11.5px;font-weight:600;
}
.tag button{color:inherit;opacity:.7;font-size:14px;line-height:1}
.tag button:hover{opacity:1}

/* ============ RESPONSIVE ============ */
@media (max-width:800px){
  .layout{grid-template-columns:1fr}
  .sidebar{
    position:fixed;top:0;bottom:0;right:0;width:var(--sidebar);
    transform:translateX(100%);transition:transform .25s;
    z-index:150;box-shadow:-10px 0 40px rgba(0,0,0,.5);
  }
  .sidebar.open{transform:translateX(0)}
  .menu-toggle{display:grid !important}
  .topbar{padding:14px 16px}
  .content{padding:16px}
  .field-row,.field-row-3{grid-template-columns:1fr}
}
.menu-toggle{
  display:none;width:38px;height:38px;border-radius:10px;
  place-items:center;background:var(--card);border:1px solid var(--border);
}
.menu-toggle svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
</style>
</head>
<body>

<!-- ============== LOGIN ============== -->
<div class="login-wrap" id="loginWrap">
  <form class="login-box" id="loginForm" autocomplete="on">
    <div class="login-logo">
      <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>

</div>

<!-- ============== LAYOUT ============== -->

    <div class="nav-scroll">

        <div class="nav-section-title">کلی</div>

          بخش هیرو
        </button>
        <button class="nav-item" data-section="stats">
          <svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 14l4-4 4 4 5-5"/></svg>
          آمار
          <span class="nav-badge" data-count="stats"></span>
        </button>
        <button class="nav-item" data-section="skills">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>
          مهارت‌ها
          <span class="nav-badge" data-count="skills"></span>
        </button>
        <button class="nav-item" data-section="focus">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>
          تمرکز فعلی

        </button>
        <button class="nav-item" data-section="projects">
          <svg viewBox="0 0 24 24"><path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
          پروژه‌ها
          <span class="nav-badge" data-count="projects"></span>
        </button>
        <button class="nav-item" data-section="contact">
          <svg viewBox="0 0 24 24"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
          تماس
          <span class="nav-badge" data-count="contact"></span>
        </button>
      </div>

      <div class="nav-section">
        <div class="nav-section-title">محتوا</div>
        <button class="nav-item" data-section="blog">
          <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
          وبلاگ
          <span class="nav-badge" data-count="blog"></span>
        </button>

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function getNested(obj, path){
  return path.split('.').reduce((o,k) => (o == null ? o : o[k]), obj);
}
function setNested(obj, path, value){
  const keys = path.split('.');
  const last = keys.pop();
  const target = keys.reduce((o,k) => {
    if (o[k] == null) o[k] = /^\d+$/.test(k) ? [] : {};
    return o[k];
  }, obj);
  target[last] = value;
}
function deepClone(o){ return JSON.parse(JSON.stringify(o)); }

function toast(msg, kind){
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast show' + (kind ? ' ' + kind : '');
  clearTimeout(t._tm);
  t._tm = setTimeout(() => { t.className = 'toast'; }, 2200);
}

function download(filename, content, mime){
  const blob = new Blob([content], { type: mime || 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ---------- AUTH ---------- */
function getPassword(){
  return localStorage.getItem(PASSWORD_KEY) || DEFAULT_PASS;
}
function isAuthed(){
  return sessionStorage.getItem(AUTH_KEY) === 'ok' || localStorage.getItem(AUTH_KEY) === 'ok-remember';
}
function setAuthed(remember){
  if (remember) localStorage.setItem(AUTH_KEY, 'ok-remember');
  else sessionStorage.setItem(AUTH_KEY, 'ok');
}
function logout(){
  sessionStorage.removeItem(AUTH_KEY);
  localStorage.removeItem(AUTH_KEY);
  location.reload();
}

/* ---------- LOAD DATA ---------- */
async function loadData(){
  // Try localStorage first
  const savedSite = localStorage.getItem(SITE_KEY);
  const savedBlog = localStorage.getItem(BLOG_KEY);

    try {
      state.site = JSON.parse(savedSite);
      state.blog = JSON.parse(savedBlog);
      state.originalSite = deepClone(state.site);
      state.originalBlog = deepClone(state.blog);
      return;
    } catch(e){ console.warn('localStorage parse failed', e); }
  }
  // Fall back to source files
  try {
    const contentCode = await (await fetch('content.js?v=' + Date.now())).text();
    state.site = new Function(contentCode + '; return SITE;')();
  } catch(e){
    console.error('Failed to load content.js', e);
    state.site = { fa:{}, en:{} };
  }
  try {
    const blogCode = await (await fetch('blog-data.js?v=' + Date.now())).text();
    state.blog = new Function(blogCode + '; return blogPosts;')();
  } catch(e){
    console.error('Failed to load blog-data.js', e);
    state.blog = [];
  }
  state.originalSite = deepClone(state.site);
  state.originalBlog = deepClone(state.blog);
}

function persist(){
  try {
    localStorage.setItem(SITE_KEY, JSON.stringify(state.site));
    localStorage.setItem(BLOG_KEY, JSON.stringify(state.blog));
    return true;
  } catch(e){
    console.error(e);

}

/* =========================================================================
   MODAL EDITOR
   ========================================================================= */
function openEditor(schemaKey, index, isNew){
  const schema = SCHEMAS[schemaKey];
  if (!schema) return;
  const L = state.lang;
  let item;
  if (schemaKey === 'blogPost'){
    const src = state.blog[index];
    item = src ? deepClone(src[L] || src.fa || {}) : {};
  } else {
    const path = schema.path;
    const arr = getNested(state.site[L], path) || [];
    item = isNew ? {} : deepClone(arr[index] || {});
  }

  state.editing = { schemaKey, index, isNew, item, path: schema.path || null };

  $('#modalTitle').textContent = (isNew ? 'افزودن ' : 'ویرایش ') + schema.title;
  const body = $('#modalBody');
  body.innerHTML = schema.fields.map(f => renderField(f, item[f.key])).join('');
  $('#modalBack').classList.add('open');
  bindModalInputs();
}

function renderField(f, value){
  const id = 'mf_' + f.key;
  if (f.type === 'textarea'){
    return `
      <div class="field">
        <label for="${id}">${esc(f.label)}</label>
        <textarea id="${id}" data-mkey="${f.key}" ${f.big ? 'rows="14"' : 'rows="4"'}>${esc(value || '')}</textarea>
        ${f.hint ? `<div class="hint">${esc(f.hint)}</div>` : ''}
      </div>
    `;
  }
  if (f.type === 'tags'){
    const tags = Array.isArray(value) ? value : [];
    return `
      <div class="field">
        <label>${esc(f.label)}</label>
        <div class="tag-input" data-tag-input data-mkey="${f.key}">
          ${tags.map(t => `<span class="tag">${esc(t)}<button type="button" data-tag-remove>×</button></span>`).join('')}
          <input type="text" placeholder="افزودن + Enter" data-tag-field />
        </div>
        ${f.hint ? `<div class="hint">${esc(f.hint)}</div>` : ''}
      </div>
    `;
  }
  return `
    <div class="field">
      <label for="${id}">${esc(f.label)}</label>
      <input type="${f.type || 'text'}" id="${id}" data-mkey="${f.key}" value="${esc(value ?? '')}" />
      ${f.hint ? `<div class="hint">${esc(f.hint)}</div>` : ''}
    </div>
  `;
}

function bindModalInputs(){
  // Tag inputs
  $$('[data-tag-input]').forEach(box => {
    const key = box.dataset.mkey;
    const input = box.querySelector('[data-tag-field]');
    const removeBtns = () => $$('[data-tag-remove]', box).forEach(b => {
      b.onclick = () => {
        b.parentElement.remove();
      };
    });
    removeBtns();
    input.onkeydown = (e) => {
      if (e.key === 'Enter' || e.key === ','){
        e.preventDefault();
        const v = input.value.trim().replace(/,$/, '');
        if (!v) return;
        const tag = document.createElement('span');
        tag.className = 'tag';
        tag.innerHTML = `${esc(v)}<button type="button" data-tag-remove>×</button>`;
        box.insertBefore(tag, input);
        input.value = '';
        removeBtns();
      }
    };
  });
}

function saveModal(){
  const { schemaKey, index, isNew, path } = state.editing;
  const schema = SCHEMAS[schemaKey];
  const L = state.lang;
  const newItem = {};

  schema.fields.forEach(f => {
    const el = $(`[data-mkey="${f.key}"]`);
    if (!el){
      const box = $(`[data-tag-input][data-mkey="${f.key}"]`);
      if (box){
        newItem[f.key] = $$('.tag', box).map(t => t.childNodes[0].textContent.trim());
      }
      return;
    }
    if (f.type === 'number'){
      newItem[f.key] = el.value === '' ? 0 : Number(el.value);
    } else {
      newItem[f.key] = el.value;
    }
  });

  if (schemaKey === 'blogPost'){
    if (isNew){
      const newPost = { id: Date.now(), fa: {}, en: {} };
      newPost[L] = newItem;
      state.blog.push(newPost);
    } else {
      state.blog[index][L] = newItem;
    }
  } else {
    const arr = getNested(state.site[L], path);
    if (isNew) arr.push(newItem);
    else arr[index] = newItem;
  }

  persist();
  closeModal();
  render();
  toast(isNew ? 'اضافه شد' : 'ذخیره شد', 'ok');
}

function closeModal(){
  $('#modalBack').classList.remove('open');
  state.editing = null;
}

/* =========================================================================
   INPUT BINDING (main content)
   ========================================================================= */
function bindInputs(){
  $$('#contentInner input[data-bind], #contentInner textarea[data-bind]').forEach(el => {
    el.oninput = (e) => {
      const bind = e.target.dataset.bind;
      const isArr = e.target.dataset.arr === 'lines';
      let value = e.target.value;
      if (isArr){
        value = value.split('\n').map(s => s.trim()).filter(Boolean);
      } else if (e.target.type === 'number'){
        value = Number(value) || 0;
      }
      setNested(state.site[state.lang], bind, value);
      persist();
    };
  });
}

/* =========================================================================
   EVENT DELEGATION
   ========================================================================= */
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-section], [data-goto], [data-action], [data-add], [data-edit], [data-del], [data-close-modal], [data-lang]');
  if (!t) return;

  if (t.dataset.section){
    state.section = t.dataset.section;
    $('#sidebar').classList.remove('open');
    render();
    return;
  }
  if (t.dataset.goto){
    state.section = t.dataset.goto;
    render();
    return;
  }
  if (t.dataset.lang){
    state.lang = t.dataset.lang;
    $$('#langSwitch button').forEach(b => b.classList.toggle('active', b.dataset.lang === state.lang));
    render();
    return;
  }
  if (t.hasAttribute('data-close-modal')){ closeModal(); return; }

  const action = t.dataset.action;
  if (action === 'save'){
    if (persist()) toast('ذخیره شد ✓', 'ok');
    return;
  }
  if (action === 'logout'){ logout(); return; }
  if (action === 'view-site'){ window.open('index.html', '_blank'); return; }
  if (action === 'reset-section'){
    if (!confirm('تغییرات این بخش به حالت اولیه برگردد؟')) return;
    state.site = deepClone(state.originalSite);
    state.blog = deepClone(state.originalBlog);
    persist();
    render();
    toast('بازگردانی شد', 'ok');
    return;
  }
  if (action === 'export-content'){
    const js = `const SITE=${JSON.stringify(state.site, null, 2)};`;
    download('content.js', js, 'application/javascript;charset=utf-8');
    toast('content.js دانلود شد', 'ok');
    return;
  }
  if (action === 'export-blog'){
    const js = `let blogPosts=${JSON.stringify(state.blog, null, 2)};`;
    download('blog-data.js', js, 'application/javascript;charset=utf-8');
    toast('blog-data.js دانلود شد', 'ok');
    return;
  }
  if (action === 'export-json'){
    const data = { site: state.site, blog: state.blog, exported: new Date().toISOString() };
    download('cms-backup-' + Date.now() + '.json', JSON.stringify(data, null, 2), 'application/json');
    toast('پشتیبان دانلود شد', 'ok');
    return;
  }
  if (action === 'import-json'){
    $('#importFile').click();
    return;
  }
  if (action === 'change-pass'){
    const p1 = $('#newPass').value;
    const p2 = $('#newPass2').value;
    if (p1.length < 6){ toast('رمز باید حداقل ۶ کاراکتر باشد', 'err'); return; }
    if (p1 !== p2){ toast('رمزها یکسان نیستند', 'err'); return; }
    localStorage.setItem(PASSWORD_KEY, p1);
    toast('رمز تغییر کرد — دفعه بعد با رمز جدید وارد شوید', 'ok');
    $('#newPass').value = ''; $('#newPass2').value = '';
    return;
  }
  if (action === 'clear-local'){
    if (!confirm('همه تغییرات محلی پاک شود؟')) return;
    localStorage.removeItem(SITE_KEY);
    localStorage.removeItem(BLOG_KEY);
    location.reload();
    return;
  }

  // Add
  if (t.dataset.add){
    openEditor(t.dataset.add, -1, true);
    return;
  }
  // Edit
  if (t.dataset.edit){
    openEditor(t.dataset.edit, Number(t.dataset.idx), false);
    return;
  }
  // Delete
  if (t.dataset.del){
    const key = t.dataset.del;
    const idx = Number(t.dataset.idx);
    if (!confirm('حذف شود؟')) return;
    if (key === 'blog'){
      state.blog.splice(idx, 1);
    } else {
      const schema = SCHEMAS[key];
      const arr = getNested(state.site[state.lang], schema.path);
      arr.splice(idx, 1);
    }
    persist();
    render();
    toast('حذف شد', 'ok');
    return;
  }
});

$('#modalSave').addEventListener('click', saveModal);
$('#modalBack').addEventListener('click', (e) => {
  if (e.target === $('#modalBack')) closeModal();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && $('#modalBack').classList.contains('open')) closeModal();
  if ((e.ctrlKey || e.metaKey) && e.key === 's'){
    e.preventDefault();
    if (persist()) toast('ذخیره شد ✓', 'ok');
  }
});

$('#importFile').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const data = JSON.parse(ev.target.result);
      if (data.site) state.site = data.site;
      if (data.blog) state.blog = data.blog;
      persist();
      render();
      toast('بازیابی شد ✓', 'ok');
    } catch(err){
      toast('فایل نامعتبر', 'err');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

$('#menuToggle').addEventListener('click', () => {
  $('#sidebar').classList.toggle('open');
});

/* =========================================================================
   LOGIN
   ========================================================================= */
$('#loginForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const pw = $('#pw').value;
  if (pw === getPassword()){
    setAuthed(true);
    boot();
  } else {
    $('#loginErr').textContent = 'رمز عبور اشتباه است';
  }
});

/* =========================================================================
   BOOT
   ========================================================================= */
async function boot(){
  $('#loginWrap').style.display = 'none';
  $('#layout').hidden = false;
  await loadData();
  render();
}

if (isAuthed()){
  boot();
} else {
  $('#loginWrap').style.display = 'grid';
  $('#layout').hidden = true;
}

})();
</script>
</body>
