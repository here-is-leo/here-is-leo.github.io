<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>.</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#000;height:100%;overflow:hidden}
  body{
    color:#00d26a;font-family:'Courier New',Courier,monospace;
    font-size:15px;line-height:1.7;cursor:crosshair;
    user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
  }
  #screen{position:fixed;inset:0;padding:20px 22px 60px;overflow-y:auto;
    scrollbar-width:none;z-index:20;transition:opacity .5s}
  #screen::-webkit-scrollbar{display:none}
  #term{white-space:pre-wrap;word-break:break-word;direction:ltr;text-align:left}
  .line{display:block;min-height:1.7em}
  .dim{color:#1c4028}.ok{color:#00d26a}.warn{color:#ffaa00}
  .err{color:#ff0033}.bold{font-weight:700}
  .ghost{color:#8a0022;text-shadow:0 0 14px #ff0033,0 0 32px #ff0033}
  .cursor{display:inline-block;width:9px;height:17px;background:#00d26a;
    vertical-align:-3px;margin-left:1px;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  #start{position:fixed;inset:0;z-index:900;display:flex;align-items:center;
    justify-content:center;flex-direction:column;gap:22px;background:#000;
    cursor:pointer;transition:opacity 1.2s}
  #start.gone{opacity:0;pointer-events:none}
  #start .warn-txt{color:#ff0033;font-size:clamp(20px,5vw,38px);
    letter-spacing:10px;text-align:center;padding:0 24px;
    animation:pulse 1.4s ease-in-out infinite;font-weight:900;
    text-shadow:0 0 25px #ff0033,0 0 70px #ff0033,0 0 140px #ff0033}
  #start .sub{color:#555;font-size:11px;letter-spacing:4px;text-align:center;
    padding:0 24px;animation:pulse 4s ease-in-out infinite reverse}
  @keyframes pulse{0%,100%{opacity:.15}50%{opacity:1}}

  #vignette{position:fixed;inset:0;pointer-events:none;z-index:350;
    background:radial-gradient(ellipse at center,transparent 8%,rgba(0,0,0,.96) 92%);
    transition:background 1s}
  #vignette.close{background:radial-gradient(ellipse at center,transparent 3%,
    rgba(40,0,0,.97) 60%,#000 100%)}
  #static{position:fixed;inset:0;pointer-events:none;z-index:400;opacity:.07;
    background:repeating-linear-gradient(to bottom,#fff 0 1px,transparent 1px 3px);
    mix-blend-mode:overlay;animation:noise .15s steps(2) infinite}
  @keyframes noise{
    0%{transform:translate(0,0)}50%{transform:translate(-2px,1px)}
    100%{transform:translate(1px,-2px)}
  }
  #redflash{position:fixed;inset:0;z-index:500;pointer-events:none;
    background:radial-gradient(circle at center,rgba(255,0,51,.85),
    rgba(255,0,51,.3) 55%,transparent 85%);opacity:0;transition:opacity .1s}
  #redflash.on{opacity:1}
  #whiteflash{position:fixed;inset:0;z-index:501;pointer-events:none;
    background:#fff;opacity:0;transition:opacity .04s}
  #whiteflash.on{opacity:.9}
  #blackout{position:fixed;inset:0;z-index:502;pointer-events:none;
    background:#000;opacity:0;transition:opacity .55s}
  #blackout.on{opacity:1}
  #tear{position:fixed;inset:0;pointer-events:none;z-index:505;opacity:0;
    background:repeating-linear-gradient(to bottom,transparent 0 2px,
    rgba(255,0,51,.11) 2px 3px);transition:opacity .08s;mix-blend-mode:screen}
  #tear.on{opacity:1}

  #face-bg{position:fixed;inset:0;z-index:2;pointer-events:none;
    opacity:0;transition:opacity 2.5s}
  #face-bg.on{opacity:.55}
  #morph{position:fixed;inset:0;z-index:3;pointer-events:none;
    opacity:0;transition:opacity 3s}
  #morph.on{opacity:.75}
  #crawler{position:fixed;inset:0;z-index:4;pointer-events:none;
    opacity:0;transition:opacity 1.5s}
  #crawler.on{opacity:1}
  #hands{position:fixed;inset:0;z-index:5;pointer-events:none;
    opacity:0;transition:opacity 1.2s}
  #hands.on{opacity:1}
  #knife{position:fixed;inset:0;z-index:6;pointer-events:none;opacity:0}
  #knife.on{opacity:1}
  #bloadeff{position:fixed;inset:0;z-index:7;pointer-events:none;overflow:hidden}
  #floattxt{position:fixed;inset:0;z-index:8;pointer-events:none;overflow:hidden}

  /* blood splatter */
  .splatter{position:absolute;pointer-events:none;
    animation:splatIn .3s cubic-bezier(.2,.9,.4,1.3) forwards,splatFade 5s 1.2s forwards}
  @keyframes splatIn{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes splatFade{to{opacity:0}}
  /* permanent bloodstain (stays longer) */
  .stain{position:absolute;pointer-events:none;
    animation:stainIn .4s ease-out forwards,stainFade 18s 6s forwards}
  @keyframes stainIn{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:.85}}
  @keyframes stainFade{to{opacity:0}}
  /* slash mark */
  .slashmark{position:fixed;pointer-events:none;z-index:9;height:3px;
    background:linear-gradient(to right,transparent,#ff0033 15%,#fff 50%,#ff0033 85%,transparent);
    box-shadow:0 0 20px #ff0033,0 0 40px #ff0033;
    animation:slashIn .12s ease-out forwards,slashFade .7s .3s forwards;
    transform-origin:left center}
  @keyframes slashIn{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes slashFade{to{opacity:0}}

  /* float messages */
  .float-msg{position:absolute;color:#ff0033;font-family:'Courier New',monospace;
    font-weight:900;letter-spacing:4px;white-space:nowrap;
    text-shadow:0 0 20px #ff0033,0 0 40px #ff0033,0 0 80px #000;
    animation:floatIn .4s ease-out forwards,floatOut .6s 1.5s forwards}
  @keyframes floatIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
  @keyframes floatOut{to{opacity:0;transform:scale(1.2)}}
  .blood-word{position:absolute;font-family:'Courier New',monospace;
    font-weight:900;letter-spacing:6px;color:#8a0000;white-space:nowrap;
    text-shadow:0 0 10px #400,0 0 30px #200,0 4px 0 #400,0 8px 0 #200;
    animation:bloodAppear .6s ease-out forwards,bloodFade 2s 2.2s forwards}
  @keyframes bloodAppear{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
  @keyframes bloodFade{to{opacity:0;transform:translateY(40px) scale(1.05)}}

  /* possession */
  #possess{position:fixed;top:12px;left:14px;z-index:820;width:min(260px,50vw);
    font-family:monospace;direction:ltr;opacity:0;transition:opacity .6s;pointer-events:none}
  #possess.on{opacity:1}
  #possess .label{font-size:9px;letter-spacing:3px;color:#ff0033;
    text-shadow:0 0 12px #ff0033;margin-bottom:3px;display:flex;justify-content:space-between}
  #possess .track{height:10px;background:#0a0000;border:1px solid #440000;
    overflow:hidden;position:relative;box-shadow:inset 0 0 8px rgba(255,0,51,.3)}
  #possess .fill{height:100%;width:0%;
    background:linear-gradient(to right,#400,#ff0033,#ff5577,#fff);
    box-shadow:0 0 14px #ff0033;transition:width .8s ease}
  #possess.full .track{animation:possessPulse .4s infinite}
  @keyframes possessPulse{
    0%,100%{box-shadow:inset 0 0 8px rgba(255,0,51,.3),0 0 10px #ff0033}
    50%{box-shadow:inset 0 0 20px rgba(255,0,51,.9),0 0 40px #ff0033,0 0 80px #ff0033}
  }

  #rec{position:fixed;top:14px;right:18px;z-index:800;display:none;
    align-items:center;gap:8px;color:#ff0033;font-family:monospace;
    font-size:12px;letter-spacing:3px;font-weight:700;
    text-shadow:0 0 14px #ff0033;direction:ltr;opacity:.95}
  #rec.on{display:flex}
  #rec .dot{width:9px;height:9px;border-radius:50%;background:#ff0033;
    box-shadow:0 0 14px #ff0033;animation:blink 1s steps(1) infinite}

  #statusbar{position:fixed;bottom:0;left:0;right:0;z-index:810;display:none;
    justify-content:space-between;padding:6px 14px;background:rgba(0,0,0,.92);
    border-top:1px solid #1a0000;font-size:10px;letter-spacing:2px;
    color:#ff0033;text-shadow:0 0 10px #ff0033;font-family:monospace;direction:ltr}
  #statusbar.on{display:flex}

  .watcher{position:fixed;z-index:840;pointer-events:none;opacity:0;
    transition:opacity 1.5s;width:clamp(120px,20vw,220px);
    height:clamp(120px,20vw,220px)}
  .watcher.on{opacity:.85}
  .watcher canvas{width:100%;height:100%;display:block;
    filter:drop-shadow(0 0 25px #ff0033)}

  .eye-pair{position:fixed;z-index:460;pointer-events:none;
    display:flex;gap:clamp(30px,7vw,80px);opacity:0;transition:opacity 1.5s}
  .eye-pair.on{opacity:1}
  .eye-pair .eye{width:clamp(30px,5vw,60px);height:clamp(18px,3.2vw,38px);
    background:radial-gradient(ellipse at center,#fff 12%,#f33 30%,#600 55%,#000 100%);
    border-radius:50%;box-shadow:0 0 50px #ff0033,0 0 100px #ff0033,0 0 180px #ff0033;
    animation:eyeBlink 4.5s infinite}
  @keyframes eyeBlink{
    0%,90%,100%{transform:scaleY(1)}93%{transform:scaleY(.05)}96%{transform:scaleY(1)}
  }

  #blood{position:fixed;inset:0;pointer-events:none;z-index:470;overflow:hidden}
  .drip{position:absolute;top:0;width:4px;
    background:linear-gradient(to bottom,rgba(180,0,0,.95),rgba(80,0,0,.6),transparent);
    border-radius:0 0 50% 50%;box-shadow:0 0 8px #600;
    animation:drip 5s linear forwards}
  @keyframes drip{from{height:0;opacity:1}to{height:100vh;opacity:.7}}
  #bloodpool{position:fixed;left:0;right:0;bottom:0;height:0;z-index:471;
    pointer-events:none;background:linear-gradient(to top,rgba(120,0,0,.95),
    rgba(80,0,0,.6),transparent);transition:height 3s ease;
    box-shadow:0 -10px 40px rgba(255,0,51,.4)}

  .scare{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;
    justify-content:center;pointer-events:none;background:#000}
  .scare .inner{font-family:'Courier New',monospace;font-weight:900;
    font-size:clamp(36px,16vw,180px);text-align:center;line-height:.9;padding:20px;
    letter-spacing:2px;animation:scareJitter .06s steps(2) infinite}
  @keyframes scareJitter{
    0%{transform:translate(-6px,5px) skewX(-4deg) scale(1.03)}
    100%{transform:translate(6px,-5px) skewX(4deg) scale(.97)}
  }
  .scare.flash{background:#ff0033}
  .scare.flash .inner{color:#000;text-shadow:0 0 60px #fff,0 0 120px #fff}
  .scare.dark{background:#000}
  .scare.dark .inner{color:#ff0033;text-shadow:0 0 40px #ff0033,0 0 90px #ff0033}
  .scare.face{background:#000}
  .scare.face .face-cvs{position:absolute;inset:0;width:100%;height:100%;display:block}
  .scare.face .scare-text{position:relative;z-index:2;color:#ff0033;
    font-family:'Courier New',monospace;font-weight:900;
    font-size:clamp(28px,10vw,110px);letter-spacing:6px;text-align:center;
    text-shadow:0 0 30px #ff0033,0 0 70px #ff0033,0 0 140px #000;
    padding:0 20px;animation:scareJitter .06s steps(2) infinite}

  #webcam-panel{position:fixed;top:50%;left:50%;
    transform:translate(-50%,-50%) scale(.9);width:min(420px,86vw);z-index:850;
    background:#050505;border:2px solid #ff0033;
    box-shadow:0 0 40px #ff0033,0 0 120px rgba(255,0,51,.5),inset 0 0 40px rgba(255,0,51,.15);
    display:none;opacity:0;transition:opacity .25s, transform .25s;direction:ltr}
  #webcam-panel.on{display:block;opacity:1;transform:translate(-50%,-50%) scale(1)}
  #webcam-panel .head{background:#1a0000;color:#ff0033;padding:6px 10px;
    font-size:11px;letter-spacing:3px;display:flex;justify-content:space-between;
    border-bottom:1px solid #ff0033;font-family:monospace}
  #webcam-panel .head .rec{animation:blink 1s infinite}
  #webcam-panel canvas{display:block;width:100%;height:auto;background:#000}
  #webcam-panel .foot{padding:6px 10px;color:#ff0033;font-size:10px;
    letter-spacing:2px;background:#0a0000;border-top:1px solid #330000;
    font-family:monospace;text-align:center}

  @keyframes shakeHard{
    0%,100%{transform:translate(0,0) rotate(0)}
    10%{transform:translate(-12px,7px) rotate(-.8deg)}
    20%{transform:translate(11px,-8px) rotate(.8deg)}
    30%{transform:translate(-9px,-6px) rotate(-.6deg)}
    40%{transform:translate(8px,9px) rotate(.7deg)}
    50%{transform:translate(-7px,5px) rotate(-.5deg)}
    60%{transform:translate(9px,-7px) rotate(.6deg)}
    70%{transform:translate(-6px,-8px) rotate(-.7deg)}
    80%{transform:translate(7px,6px) rotate(.5deg)}
    90%{transform:translate(-5px,-4px) rotate(-.4deg)}
  }
  #screen.shake{animation:shakeHard .6s cubic-bezier(.36,.07,.19,.97)}

  .final-title{display:block;text-align:center;color:#ff0033;
    font-family:'Courier New',monospace;font-size:clamp(24px,8vw,58px);
    font-weight:900;letter-spacing:5px;
    text-shadow:0 0 35px #ff0033,0 0 80px #ff0033,0 0 140px #ff0033;
    margin:26px 0;animation:flick 3.5s steps(1) infinite}
  @keyframes flick{
    0%,91%,100%{opacity:1}92%{opacity:0}93.5%{opacity:1}
    95%{opacity:0}96.5%{opacity:1}
  }

  /* screaming woman face overlay (fixed) */
  #scream-face{position:fixed;inset:0;z-index:503;pointer-events:none;
    opacity:0;transition:opacity .4s}
  #scream-face.on{opacity:1}

  @keyframes bodyPulse{
    0%,100%{transform:scale(1)}8%{transform:scale(1.012)}
    16%{transform:scale(1)}24%{transform:scale(1.012)}32%{transform:scale(1)}
  }
  body.pulse{animation:bodyPulse 1.5s ease-out}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
  }
</style>
</head>
<body>

<div id="screen"><div id="term"><span class="cursor"></span></div></div>
<canvas id="face-bg"></canvas>
<canvas id="morph"></canvas>
<canvas id="crawler"></canvas>
<canvas id="hands"></canvas>
<canvas id="knife"></canvas>
<canvas id="scream-face"></canvas>
<div id="bloadeff"></div>
<div id="floattxt"></div>

<div id="vignette"></div>
<div id="static"></div>
<div id="tear"></div>
<div id="redflash"></div>
<div id="whiteflash"></div>
<div id="blackout"></div>
<div id="blood"></div>
<div id="bloodpool"></div>

<div id="rec"><span class="dot"></span>REC</div>
<div id="possess">
  <div class="label"><span>POSSESSION</span><span class="pval">0%</span></div>
  <div class="track"><div class="fill"></div></div>
</div>
<div id="statusbar">
  <span>● CAM: LIVE</span><span>● MIC: LIVE</span>
  <span>● LOC: TRACKED</span><span>● YOU: MINE</span>
</div>

<div id="start">
  <div class="warn-txt">DO NOT CLICK</div>
  <div class="sub">once you enter — you cannot leave</div>
</div>

<script>
(function(){
'use strict';
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ============================================================
   AUDIO
   ============================================================ */
let ac = null;
function audioInit(){
  if(ac) return ac;
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return null;
  ac = new AC();
  return ac;
}
function audioResume(){ if(ac && ac.state === 'suspended') ac.resume(); }

let droneStarted = false, droneGain = null;
function startDrone(){
  if(!ac || droneStarted) return;
  droneStarted = true;
  const t = ac.currentTime;
  const o1 = ac.createOscillator(); o1.type='sawtooth'; o1.frequency.value = 30;
  const o2 = ac.createOscillator(); o2.type='sawtooth'; o2.frequency.value = 30.6;
  const o3 = ac.createOscillator(); o3.type='sine';     o3.frequency.value = 16;
  const o4 = ac.createOscillator(); o4.type='sine';     o4.frequency.value = 48;
  const lp = ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = 190; lp.Q.value = 6;
  droneGain = ac.createGain(); droneGain.gain.value = 0.06;
  const lfo = ac.createOscillator(); lfo.frequency.value = 0.13;
  const lfoG = ac.createGain(); lfoG.gain.value = 0.035;
  lfo.connect(lfoG).connect(droneGain.gain); lfo.start();
  o1.connect(lp); o2.connect(lp); o3.connect(lp); o4.connect(lp);
  lp.connect(droneGain).connect(ac.destination);
  o1.start(); o2.start(); o3.start(); o4.start();
}

function scream(intensity){
  if(!ac) return;
  intensity = intensity || 1;
  const t = ac.currentTime;
  const dur = 1.5;
  const buf = ac.createBuffer(1, Math.floor(ac.sampleRate*dur), ac.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/d.length, 1.6);
  const noise = ac.createBufferSource(); noise.buffer = buf;
  const bq = ac.createBiquadFilter(); bq.type='bandpass';
  bq.frequency.setValueAtTime(4600, t);
  bq.frequency.exponentialRampToValueAtTime(140, t+dur);
  bq.Q.value = 4;
  const gn = ac.createGain();
  gn.gain.setValueAtTime(0.7 * intensity, t);
  gn.gain.exponentialRampToValueAtTime(0.001, t+dur);
  noise.connect(bq).connect(gn).connect(ac.destination);
  noise.start(t); noise.stop(t+dur+.02);
  [3600, 2600, 1900, 1300, 900].forEach((f,i)=>{
    const o = ac.createOscillator();
    o.type = i%2 ? 'square':'sawtooth';
    o.frequency.setValueAtTime(f, t);
    o.frequency.exponentialRampToValueAtTime(45 + i*18, t+1.1);
    const og = ac.createGain();
    og.gain.setValueAtTime((0.19 - i*0.028) * intensity, t);
    og.gain.exponentialRampToValueAtTime(0.001, t+1.2);
    o.connect(og).connect(ac.destination);
    o.start(t); o.stop(t+1.25);
  });
  const sub = ac.createOscillator(); sub.type='sine';
  sub.frequency.setValueAtTime(180, t);
  sub.frequency.exponentialRampToValueAtTime(18, t+.7);
  const sg = ac.createGain();
  sg.gain.setValueAtTime(0.55 * intensity, t);
  sg.gain.exponentialRampToValueAtTime(0.001, t+.8);
  sub.connect(sg).connect(ac.destination);
  sub.start(t); sub.stop(t+.85);
}

function heartbeat(){
  if(!ac) return;
  const t = ac.currentTime;
  [0, .17].forEach(off=>{
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type='sine';
    o.frequency.setValueAtTime(82, t+off);
    o.frequency.exponentialRampToValueAtTime(25, t+off+.18);
    g.gain.setValueAtTime(0.24, t+off);
    g.gain.exponentialRampToValueAtTime(0.0001, t+off+.34);
    o.connect(g).connect(ac.destination);
    o.start(t+off); o.stop(t+off+.37);
  });
}

function blip(f){
  if(!ac) return;
  const t = ac.currentTime;
  const o = ac.createOscillator();
  const g = ac.createGain();
  o.type='square'; o.frequency.value = f||1100;
  g.gain.setValueAtTime(0.03, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t+.05);
  o.connect(g).connect(ac.destination);
  o.start(t); o.stop(t+.06);
}

function boom(){
  if(!ac) return;
  const t = ac.currentTime;
  const o = ac.createOscillator();
  const g = ac.createGain();
  o.type='sine';
  o.frequency.setValueAtTime(120, t);
  o.frequency.exponentialRampToValueAtTime(18, t+1.7);
  g.gain.setValueAtTime(0.45, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t+1.8);
  o.connect(g).connect(ac.destination);
  o.start(t); o.stop(t+1.9);
}

function breath(vol){
  if(!ac) return;
  vol = vol || 0.1;
  const t = ac.currentTime;
  const dur = 1.9;
  const buf = ac.createBuffer(1, ac.sampleRate*dur, ac.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<d.length;i++){
    const env = Math.sin(Math.PI*i/d.length);
    d[i] = (Math.random()*2-1) * env * 0.55;
  }
  const src = ac.createBufferSource(); src.buffer = buf;
  const bp = ac.createBiquadFilter(); bp.type='bandpass';
  bp.frequency.value = 540; bp.Q.value = 1.1;
  const g = ac.createGain(); g.gain.value = vol;
  src.connect(bp).connect(g).connect(ac.destination);
  src.start(t);
}

function growl(){
  if(!ac) return;
  const t = ac.currentTime;
  const dur = 2.2;
  const buf = ac.createBuffer(1, ac.sampleRate*dur, ac.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<d.length;i++){
    const env = Math.sin(Math.PI*i/d.length);
    d[i] = (Math.random()*2-1) * env * 0.6;
  }
  const src = ac.createBufferSource(); src.buffer = buf;
  const bp = ac.createBiquadFilter(); bp.type='bandpass';
  bp.frequency.setValueAtTime(130, t);
  bp.frequency.linearRampToValueAtTime(340, t+dur);
  bp.Q.value = 4;
  const g = ac.createGain(); g.gain.value = 0.18;
  src.connect(bp).connect(g).connect(ac.destination);
  src.start(t);
}

function slashSound(){
  if(!ac) return;
  const t = ac.currentTime;
  const dur = 0.35;
  const buf = ac.createBuffer(1, ac.sampleRate*dur, ac.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/d.length, 3);
  const src = ac.createBufferSource(); src.buffer = buf;
  const hp = ac.createBiquadFilter(); hp.type='highpass'; hp.frequency.value = 2000;
  const g = ac.createGain();
  g.gain.setValueAtTime(0.4, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+dur);

function whisper(text){

    ctx.beginPath();
    ctx.moveTo(tx-7, mouthY+mouthH*0.98);
    ctx.lineTo(tx+7, mouthY+mouthH*0.98);
    ctx.lineTo(tx + (Math.random()*4-2), mouthY+mouthH*0.98 - th);
    ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = 'rgba(140,0,0,0.9)';
  for(let i=0;i<10;i++){
    const bx = cx-fw*0.85 + i*fw*0.19;
    const bh = 30 + Math.random()*140;
    ctx.fillRect(bx, mouthY+mouthH*0.7, 3 + Math.random()*4, bh);
  }
}

/* 7 — ZOMBIE */
function drawZombie(ctx, cx, cy, s){
  const fw = s*0.32, fh = s*0.44;
  const grd = ctx.createRadialGradient(cx, cy-fh*0.1, fw*0.15, cx, cy, fw*1.5);
  grd.addColorStop(0,'#8a9878'); grd.addColorStop(0.5,'#3a4830'); grd.addColorStop(1,'#0a1008');
  ctx.fillStyle = grd;
  ctx.beginPath(); ctx.ellipse(cx, cy, fw, fh, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(20,10,0,0.9)';
  for(let i=0;i<12;i++){
    const rx = cx + (Math.random()-0.5)*fw*1.6;
    const ry = cy + (Math.random()-0.5)*fh*1.6;
    const rr = 3 + Math.random()*10;
    ctx.beginPath();
    ctx.ellipse(rx, ry, rr, rr*0.8, Math.random()*Math.PI, 0, Math.PI*2);
    ctx.fill();
  }
  const eyeY = cy-fh*0.18, eyeX = fw*0.38, eyeR = fw*0.28;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(cx-eyeX, eyeY, eyeR*1.1, eyeR*1.3, 0, 0, Math.PI*2);
  ctx.ellipse(cx+eyeX, eyeY+fh*0.04, eyeR*1.1, eyeR*1.3, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#d8c878';
  ctx.beginPath();
  ctx.arc(cx-eyeX, eyeY, eyeR*0.15, 0, Math.PI*2);
  ctx.arc(cx+eyeX, eyeY+fh*0.04, eyeR*0.15, 0, Math.PI*2);
  ctx.fill();
  ctx.save();
  ctx.strokeStyle = '#5a1818'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx+eyeX, eyeY+fh*0.04 + eyeR*0.6);
  ctx.lineTo(cx+eyeX+2, eyeY+fh*0.18);
  ctx.stroke();
  ctx.fillStyle = '#e8e0d0'; ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(cx+eyeX+2, eyeY+fh*0.20, eyeR*0.20, 0, Math.PI*2);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(cx+eyeX+2, eyeY+fh*0.20, eyeR*0.09, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
  ctx.fillStyle = 'rgba(200,190,160,0.85)';
  ctx.beginPath();
  ctx.ellipse(cx-fw*0.55, cy+fh*0.15, fw*0.15, fh*0.22, 0.3, 0, Math.PI*2);
  ctx.fill();
  const mouthY = cy+fh*0.42, mouthW = fw*0.78, mouthH = fh*0.20;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.moveTo(cx-mouthW, mouthY); ctx.lineTo(cx+mouthW, mouthY);
  ctx.lineTo(cx+mouthW*0.85, mouthY+mouthH);
  ctx.lineTo(cx-mouthW*0.85, mouthY+mouthH);
  ctx.closePath(); ctx.fill();
  for(let i=0;i<7;i++){
    const tx = cx-mouthW*0.85 + (i+0.5)*(mouthW*1.7/7);
    ctx.fillStyle = '#b0a878';
    ctx.beginPath();
    ctx.moveTo(tx-6, mouthY); ctx.lineTo(tx+6, mouthY);
    ctx.lineTo(tx + (Math.random()*4-2), mouthY + 4 + Math.random()*6);
    ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = 'rgba(120,140,40,0.7)';
  for(let i=0;i<4;i++){
    ctx.fillRect(cx-fw*0.5 + i*fw*0.3, mouthY+mouthH*0.6, 4, 30+Math.random()*60);
  }
}

/* 8 — MARA (hair-covered) */
function drawHairFace(ctx, cx, cy, s){
  const fw = s*0.34, fh = s*0.48;
  const grd = ctx.createRadialGradient(cx, cy-fh*0.1, fw*0.15, cx, cy, fw*1.5);
  grd.addColorStop(0,'#f0e8e0'); grd.addColorStop(0.5,'#a89898'); grd.addColorStop(1,'#100808');
  ctx.fillStyle = grd;
  ctx.beginPath(); ctx.ellipse(cx, cy, fw, fh, 0, 0, Math.PI*2); ctx.fill();
  const eyeY = cy-fh*0.14, eyeR = fw*0.22;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(cx+fw*0.30, eyeY, eyeR*1.1, eyeR*1.3, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.shadowColor = '#fff'; ctx.shadowBlur = 15;
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(cx+fw*0.30, eyeY, eyeR*0.22, 0, Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(cx+fw*0.30, eyeY, eyeR*0.09, 0, Math.PI*2); ctx.fill();
  const mouthY = cy+fh*0.42, mouthW = fw*0.6, mouthH = fh*0.14;
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.ellipse(cx, mouthY, mouthW, mouthH, 0, 0, Math.PI*2); ctx.fill();
  for(let i=0;i<6;i++){
    const tx = cx-mouthW*0.9 + (i+0.5)*(mouthW*1.8/6);
    ctx.fillStyle = '#c8bc98';
    ctx.fillRect(tx-3, mouthY-mouthH*0.9, 6, mouthH*0.6);
  }
  ctx.strokeStyle = '#000'; ctx.lineCap = 'round';
  for(let i=0;i<50;i++){
    ctx.lineWidth = 1.5 + Math.random()*3;
    const startX = cx + (Math.random()-0.5)*fw*2.6;
    const startY = cy - fh*1.5;
    const endX = cx + (Math.random()-0.5)*fw*2.4;
    const endY = cy + fh*(0.5 + Math.random()*1.1);
    ctx.beginPath();
    ctx.moveTo(startX, startY);
    ctx.quadraticCurveTo((startX+endX)/2 + (Math.random()-0.5)*35, (startY+endY)/2, endX, endY);
    ctx.stroke();
  }
}

/* 9 — VOID (only glowing eyes) */
function drawVoid(ctx, cx, cy, s){

/* 10 — CHILD */
function drawChild(ctx, cx, cy, s){
  const fw = s*0.26, fh = s*0.36;
  const grd = ctx.createRadialGradient(cx, cy-fh*0.1, fw*0.15, cx, cy, fw*1.5);

  ctx.ellipse(cx-eyeX, eyeY, eyeR, eyeR*1.15, 0, 0, Math.PI*2);

  ctx.fillStyle = '#fff';

  ctx.arc(cx-eyeX, eyeY, eyeR*0.06, 0, Math.PI*2);
  ctx.arc(cx+eyeX, eyeY, eyeR*0.06, 0, Math.PI*2);

}

/* 11 — BURNING */
function drawBurning(ctx, cx, cy, s){
  const fw = s*0.30, fh = s*0.44;
  const grd = ctx.createRadialGradient(cx, cy-fh*0.1, fw*0.15, cx, cy, fw*1.5);
  grd.addColorStop(0,'#200808'); grd.addColorStop(0.5,'#100404'); grd.addColorStop(1,'#000');
  ctx.fillStyle = grd;
  ctx.beginPath(); ctx.ellipse(cx, cy, fw, fh, 0, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#ff5010'; ctx.lineWidth = 2;
  ctx.shadowColor = '#ff3300'; ctx.shadowBlur = 25;
  for(let i=0;i<12;i++){
    const a = Math.random()*Math.PI*2;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    let px = cx, py = cy;
    for(let j=0;j<4;j++){
      px += Math.cos(a + (Math.random()-0.5)*0.6) * fw*0.25;
      py += Math.sin(a + (Math.random()-0.5)*0.6) * fh*0.25;
      ctx.lineTo(px, py);
    }
    ctx.stroke();
  }
  ctx.shadowBlur = 0;
  const eyeY = cy-fh*0.16, eyeX = fw*0.40;
  ctx.shadowColor = '#ff6600'; ctx.shadowBlur = 45;
  ctx.fillStyle = '#ffcc00';
  ctx.beginPath();
  ctx.arc(cx-eyeX, eyeY, fw*0.09, 0, Math.PI*2);
  ctx.arc(cx+eyeX, eyeY, fw*0.09, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(cx-eyeX, eyeY, fw*0.035, 0, Math.PI*2);
  ctx.arc(cx+eyeX, eyeY, fw*0.035, 0, Math.PI*2);
  ctx.fill();
  ctx.shadowBlur = 0;
  const mouthY = cy+fh*0.42, mouthW = fw*0.55, mouthH = fh*0.34;
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.ellipse(cx, mouthY, mouthW, mouthH, 0, 0, Math.PI*2); ctx.fill();
  ctx.shadowColor = '#ff3300'; ctx.shadowBlur = 25;
  ctx.fillStyle = '#ff4400';
  for(let i=0;i<10;i++){
    ctx.beginPath();
    ctx.arc(cx + (Math.random()-0.5)*mouthW*1.5, mouthY + (Math.random()-0.5)*mouthH*1.5,
            1.5 + Math.random()*2.5, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.shadowBlur = 0;
}

/* 12 — SEWN MOUTH (lips stitched shut) */
function drawSewn(ctx, cx, cy, s){
  const fw = s*0.30, fh = s*0.44;
  const grd = ctx.createRadialGradient(cx, cy-fh*0.1, fw*0.15, cx, cy, fw*1.5);
  grd.addColorStop(0,'#c8b8a0'); grd.addColorStop(0.5,'#5a4840'); grd.addColorStop(1,'#0a0606');
  ctx.fillStyle = grd;
  ctx.beginPath(); ctx.ellipse(cx, cy, fw, fh, 0, 0, Math.PI*2); ctx.fill();
  // scars / cracks
  ctx.strokeStyle = 'rgba(60,20,10,0.6)'; ctx.lineWidth = 1.5;
  for(let i=0;i<8;i++){
    const a = Math.random()*Math.PI*2;
    ctx.beginPath();
    ctx.moveTo(cx+Math.cos(a)*fw*0.3, cy+Math.sin(a)*fh*0.3);
    ctx.lineTo(cx+Math.cos(a)*fw*0.95, cy+Math.sin(a)*fh*0.95);
    ctx.stroke();
  }
  const eyeY = cy-fh*0.16, eyeX = fw*0.38, eyeR = fw*0.28;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(cx-eyeX, eyeY, eyeR, eyeR*1.1, 0, 0, Math.PI*2);
  ctx.ellipse(cx+eyeX, eyeY, eyeR, eyeR*1.1, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.shadowColor = '#ff0033'; ctx.shadowBlur = 25;
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(cx-eyeX, eyeY, eyeR*0.10, 0, Math.PI*2);
  ctx.arc(cx+eyeX, eyeY, eyeR*0.10, 0, Math.PI*2);
  ctx.fill(); ctx.shadowBlur = 0;
  // sewn mouth — a straight line with X stitches
  const mouthY = cy+fh*0.42, mouthW = fw*0.75;
  ctx.strokeStyle = '#3a1010'; ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(cx-mouthW, mouthY); ctx.lineTo(cx+mouthW, mouthY);
  ctx.stroke();
  // X stitches
  ctx.strokeStyle = '#000'; ctx.lineWidth = 2.5;
  const stitches = 10;
  for(let i=0;i<stitches;i++){
    const sx = cx-mouthW + (i+0.5)*(mouthW*2/stitches);
    const sh = 8 + Math.random()*4;
    ctx.beginPath();
    ctx.moveTo(sx-sh, mouthY-sh); ctx.lineTo(sx+sh, mouthY+sh);
    ctx.moveTo(sx+sh, mouthY-sh); ctx.lineTo(sx-sh, mouthY+sh);
    ctx.stroke();
  }
  // blood seeping through stitches
  ctx.fillStyle = 'rgba(140,0,0,0.85)';
  for(let i=0;i<stitches;i++){
    const sx = cx-mouthW + (i+0.5)*(mouthW*2/stitches);
    ctx.fillRect(sx-1, mouthY+6, 2, 20 + Math.random()*60);
  }
}

/* 13 — BLOODY TEARS (girl with blood tears) */
function drawBloodTears(ctx, cx, cy, s){
  const fw = s*0.30, fh = s*0.44;
  const grd = ctx.createRadialGradient(cx, cy-fh*0.1, fw*0.15, cx, cy, fw*1.5);
  grd.addColorStop(0,'#d8c0a8'); grd.addColorStop(0.5,'#7a6050'); grd.addColorStop(1,'#100808');
  ctx.fillStyle = grd;
  ctx.beginPath(); ctx.ellipse(cx, cy, fw, fh, 0, 0, Math.PI*2); ctx.fill();
  // long hair
  ctx.strokeStyle = '#000'; ctx.lineCap = 'round';
  for(let i=0;i<35;i++){
    ctx.lineWidth = 1.5 + Math.random()*2.5;
    const sx = cx + (Math.random()-0.5)*fw*2.4;
    const sy = cy - fh*1.4;
    const ex = cx + (Math.random()-0.5)*fw*2.2;
    const ey = cy + fh*(0.8 + Math.random()*1.2);
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.quadraticCurveTo((sx+ex)/2 + (Math.random()-0.5)*30, (sy+ey)/2, ex, ey);
    ctx.stroke();
  }
  const eyeY = cy-fh*0.14, eyeX = fw*0.36, eyeR = fw*0.24;
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.ellipse(cx-eyeX, eyeY, eyeR, eyeR*1.15, 0, 0, Math.PI*2);
  ctx.ellipse(cx+eyeX, eyeY, eyeR, eyeR*1.15, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.shadowColor = '#ff0033'; ctx.shadowBlur = 20;
  ctx.fillStyle = '#3a0000';
  ctx.beginPath();
  ctx.arc(cx-eyeX, eyeY, eyeR*0.40, 0, Math.PI*2);
  ctx.arc(cx+eyeX, eyeY, eyeR*0.40, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(cx-eyeX, eyeY, eyeR*0.20, 0, Math.PI*2);
  ctx.arc(cx+eyeX, eyeY, eyeR*0.20, 0, Math.PI*2);
  ctx.fill(); ctx.shadowBlur = 0;
  // blood tears
  ctx.fillStyle = 'rgba(180,0,0,0.95)';
  ctx.fillRect(cx-eyeX-3, eyeY+eyeR*0.6, 6, 80 + Math.random()*80);
  ctx.fillRect(cx+eyeX-3, eyeY+eyeR*0.6, 6, 80 + Math.random()*80);
  // mouth open slightly, blood
  const mouthY = cy+fh*0.42, mouthW = fw*0.45, mouthH = fh*0.14;
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.ellipse(cx, mouthY, mouthW, mouthH, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(160,0,0,0.9)';
  ctx.fillRect(cx-4, mouthY+mouthH*0.5, 8, 40 + Math.random()*50);
}

/* 14 — DECAYING (skin falling off) */
function drawDecaying(ctx, cx, cy, s){
  const fw = s*0.32, fh = s*0.44;
  const grd = ctx.createRadialGradient(cx, cy-fh*0.1, fw*0.15, cx, cy, fw*1.5);
  grd.addColorStop(0,'#a89080'); grd.addColorStop(0.5,'#5a4030'); grd.addColorStop(1,'#0a0404');
  ctx.fillStyle = grd;
  ctx.beginPath(); ctx.ellipse(cx, cy, fw, fh, 0, 0, Math.PI*2); ctx.fill();
  // holes in face
  ctx.fillStyle = '#000';
  for(let i=0;i<14;i++){
    const rx = cx + (Math.random()-0.5)*fw*1.7;
    const ry = cy + (Math.random()-0.5)*fh*1.7;
    const rr = 4 + Math.random()*14;
    ctx.beginPath();
    ctx.ellipse(rx, ry, rr, rr*0.85, Math.random()*Math.PI, 0, Math.PI*2);
    ctx.fill();
    // blood around hole
    ctx.fillStyle = 'rgba(120,0,0,0.7)';
    ctx.beginPath();
    ctx.ellipse(rx, ry, rr+3, rr*0.85+3, 0, 0, Math.PI*2);
    ctx.stroke();
    ctx.fillStyle = '#000';
  }
  const eyeY = cy-fh*0.16, eyeX = fw*0.38, eyeR = fw*0.30;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(cx-eyeX, eyeY, eyeR*1.15, eyeR*1.3, 0, 0, Math.PI*2);
  ctx.ellipse(cx+eyeX, eyeY, eyeR*1.15, eyeR*1.3, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.shadowColor = '#ff3300'; ctx.shadowBlur = 25;
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(cx-eyeX, eyeY, eyeR*0.10, 0, Math.PI*2);
  ctx.arc(cx+eyeX, eyeY, eyeR*0.10, 0, Math.PI*2);
  ctx.fill(); ctx.shadowBlur = 0;
  const mouthY = cy+fh*0.42, mouthW = fw*0.78, mouthH = fh*0.22;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.moveTo(cx-mouthW, mouthY);
  ctx.quadraticCurveTo(cx, mouthY+mouthH*2, cx+mouthW, mouthY);
  ctx.quadraticCurveTo(cx, mouthY+mouthH*0.6, cx-mouthW, mouthY);
  ctx.fill();
  // broken teeth
  for(let i=0;i<5;i++){
    const tx = cx-mouthW*0.7 + i*(mouthW*1.4/4);
    ctx.fillStyle = '#b8a878';
    ctx.beginPath();
    ctx.moveTo(tx-5, mouthY);
    ctx.lineTo(tx+5, mouthY);
    ctx.lineTo(tx + (Math.random()*3-1.5), mouthY + 4 + Math.random()*6);
    ctx.closePath(); ctx.fill();
  }
}

/* 15 — MIRROR (a face reflected in darkness) */
function drawMirror(ctx, cx, cy, s){
  const fw = s*0.30, fh = s*0.44;
  // mirror frame — oval border with shine

  ctx.globalAlpha = 0.7;

  grd2.addColorStop(0,'#807060'); grd2.addColorStop(0.5,'#3a2820'); grd2.addColorStop(1,'#000');
  ctx.fillStyle = grd2;
  ctx.beginPath(); ctx.ellipse(cx, cy, fw*0.85, fh*0.85, 0, 0, Math.PI*2); ctx.fill();
  const eyeY = cy-fh*0.14, eyeX = fw*0.32, eyeR = fw*0.22;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(cx-eyeX, eyeY, eyeR, eyeR*1.3, 0, 0, Math.PI*2);
  ctx.ellipse(cx+eyeX, eyeY, eyeR, eyeR*1.3, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.shadowColor = '#ff0033'; ctx.shadowBlur = 25;
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(cx-eyeX, eyeY, eyeR*0.10, 0, Math.PI*2);
  ctx.arc(cx+eyeX, eyeY, eyeR*0.10, 0, Math.PI*2);
  ctx.fill(); ctx.shadowBlur = 0;
  const mouthY = cy+fh*0.36, mouthW = fw*0.42, mouthH = fh*0.14;
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.ellipse(cx, mouthY, mouthW, mouthH, 0, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1;
  // crack in mirror
  ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(cx-fw*0.7, cy-fh*0.6);
  ctx.lineTo(cx+fw*0.2, cy+fh*0.1);
  ctx.lineTo(cx+fw*0.7, cy-fh*0.3);
  ctx.stroke();
}

/* 16 — PALE WOMAN (long black hair, wide open mouth) */
function drawPaleWoman(ctx, cx, cy, s){
  const fw = s*0.32, fh = s*0.46;
  const grd = ctx.createRadialGradient(cx, cy-fh*0.1, fw*0.15, cx, cy, fw*1.5);
  grd.addColorStop(0,'#f8f0e8'); grd.addColorStop(0.5,'#b0a8a0'); grd.addColorStop(1,'#1a1010');
  ctx.fillStyle = grd;
  ctx.beginPath(); ctx.ellipse(cx, cy, fw, fh, 0, 0, Math.PI*2); ctx.fill();
  // eye sockets — deep
  const eyeY = cy-fh*0.18, eyeX = fw*0.36, eyeR = fw*0.28;
  ctx.fillStyle = '#000';
  ctx.shadowColor = '#000'; ctx.shadowBlur = 35;
  ctx.beginPath();
  ctx.ellipse(cx-eyeX, eyeY, eyeR*1.1, eyeR*1.4, 0, 0, Math.PI*2);
  ctx.ellipse(cx+eyeX, eyeY, eyeR*1.1, eyeR*1.4, 0, 0, Math.PI*2);
  ctx.fill(); ctx.shadowBlur = 0;
  // tiny red glints
  ctx.shadowColor = '#ff0033'; ctx.shadowBlur = 30;
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(cx-eyeX, eyeY, eyeR*0.07, 0, Math.PI*2);
  ctx.arc(cx+eyeX, eyeY, eyeR*0.07, 0, Math.PI*2);
  ctx.fill(); ctx.shadowBlur = 0;
  // wide open mouth
  const mouthY = cy+fh*0.42, mouthW = fw*0.5, mouthH = fh*0.42;
  ctx.fillStyle = '#000';
  ctx.shadowColor = '#000'; ctx.shadowBlur = 25;
  ctx.beginPath(); ctx.ellipse(cx, mouthY, mouthW, mouthH, 0, 0, Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = '#3a2020'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.ellipse(cx, mouthY, mouthW, mouthH, 0, 0, Math.PI*2); ctx.stroke();
  // long black hair
  ctx.strokeStyle = '#000'; ctx.lineCap = 'round';
  for(let i=0;i<45;i++){
    ctx.lineWidth = 2 + Math.random()*3;
    const sx = cx + (Math.random()-0.5)*fw*2.8;
    const sy = cy - fh*1.6;
    const ex = cx + (Math.random()-0.5)*fw*2.6;
    const ey = cy + fh*(0.8 + Math.random()*1.4);
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.quadraticCurveTo((sx+ex)/2 + (Math.random()-0.5)*40, (sy+ey)/2, ex, ey);
    ctx.stroke();
  }
}

/* 17 — SCREAMING SKULL (with horns) */
function drawScreamingSkull(ctx, cx, cy, s){
  const fw = s*0.30, fh = s*0.42;
  // horns
  ctx.fillStyle = '#1a0808'; ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx-fw*0.85, cy-fh*0.45);
  ctx.quadraticCurveTo(cx-fw*1.6, cy-fh*1.5, cx-fw*0.9, cy-fh*1.95);
  ctx.quadraticCurveTo(cx-fw*1.05, cy-fh*1.3, cx-fw*0.4, cy-fh*0.65);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx+fw*0.85, cy-fh*0.45);
  ctx.quadraticCurveTo(cx+fw*1.6, cy-fh*1.5, cx+fw*0.9, cy-fh*1.95);
  ctx.quadraticCurveTo(cx+fw*1.05, cy-fh*1.3, cx+fw*0.4, cy-fh*0.65);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  // skull
  const grd = ctx.createRadialGradient(cx, cy-fh*0.1, fw*0.15, cx, cy, fw*1.5);
  grd.addColorStop(0,'#e8dcc0'); grd.addColorStop(0.5,'#a08860'); grd.addColorStop(1,'#1a0808');
  ctx.fillStyle = grd;
  ctx.beginPath(); ctx.ellipse(cx, cy, fw, fh, 0, 0, Math.PI*2); ctx.fill();
  // cracks
  ctx.strokeStyle = 'rgba(0,0,0,0.85)'; ctx.lineWidth = 2;
  for(let i=0;i<8;i++){
    const a = Math.random()*Math.PI*2;
    ctx.beginPath();
    ctx.moveTo(cx+Math.cos(a)*fw*0.15, cy+Math.sin(a)*fh*0.15);
    ctx.lineTo(cx+Math.cos(a)*fw*0.95, cy+Math.sin(a)*fh*0.95);
    ctx.stroke();
  }
  // big eye sockets
  const eyeY = cy-fh*0.15, eyeX = fw*0.42, eyeR = fw*0.34;
  ctx.fillStyle = '#000';
  ctx.shadowColor = '#000'; ctx.shadowBlur = 30;
  ctx.beginPath();
  ctx.ellipse(cx-eyeX, eyeY, eyeR*1.15, eyeR*1.3, -0.1, 0, Math.PI*2);
  ctx.ellipse(cx+eyeX, eyeY, eyeR*1.15, eyeR*1.3, 0.1, 0, Math.PI*2);
  ctx.fill(); ctx.shadowBlur = 0;
  // red glowing eyes
  ctx.shadowColor = '#ff0033'; ctx.shadowBlur = 45;
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(cx-eyeX, eyeY, eyeR*0.10, 0, Math.PI*2);
  ctx.arc(cx+eyeX, eyeY, eyeR*0.10, 0, Math.PI*2);
  ctx.fill(); ctx.shadowBlur = 0;
  // nose triangle
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.moveTo(cx, cy+fh*0.02);
  ctx.lineTo(cx-fw*0.11, cy+fh*0.22);
  ctx.lineTo(cx+fw*0.11, cy+fh*0.22);
  ctx.closePath(); ctx.fill();
  // WIDE screaming mouth (ellipse)
  const mouthY = cy+fh*0.55, mouthW = fw*0.65, mouthH = fh*0.32;
  ctx.fillStyle = '#000';
  ctx.shadowColor = '#000'; ctx.shadowBlur = 25;
  ctx.beginPath(); ctx.ellipse(cx, mouthY, mouthW, mouthH, 0, 0, Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;
  // teeth around
  for(let i=0;i<10;i++){
    const a = (i/10) * Math.PI * 2;
    const tx = cx + Math.cos(a) * mouthW * 0.9;
    const ty = mouthY + Math.sin(a) * mouthH * 0.9;
    ctx.fillStyle = '#d8cba8';
    ctx.beginPath();
    ctx.moveTo(tx-5, ty-5); ctx.lineTo(tx+5, ty-5);
    ctx.lineTo(tx + (Math.random()*4-2), ty + (a > Math.PI ? -10 : 10));
    ctx.closePath(); ctx.fill();
  }
  // blood
  ctx.fillStyle = 'rgba(160,0,0,0.9)';
  ctx.fillRect(cx-eyeX-4, eyeY+eyeR*0.9, 8, 60+Math.random()*80);
  ctx.fillRect(cx+eyeX-4, eyeY+eyeR*0.9, 8, 60+Math.random()*80);
}

/* ============================================================
   KNIFE
   ============================================================ */
function drawKnife(ctx, x, y, angle, scale, dripping){
  ctx.save();
  ctx.translate(x, y); ctx.rotate(angle); ctx.scale(scale, scale);
  const L = 280;
  const grd = ctx.createLinearGradient(0, 0, L, 0);
  grd.addColorStop(0, '#444'); grd.addColorStop(0.3, '#d8d8d8');
  grd.addColorStop(0.5, '#fff'); grd.addColorStop(0.7, '#a8a8a8');
  grd.addColorStop(1, '#555');
  ctx.fillStyle = grd; ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, -9);
  ctx.lineTo(L*0.85, -6);
  ctx.quadraticCurveTo(L, -2, L, 0);
  ctx.quadraticCurveTo(L*0.98, 4, L*0.9, 6);
  ctx.lineTo(0, 9);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(4, -6); ctx.lineTo(L*0.85, -3);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(120,0,0,0.9)'; ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(10, 0); ctx.lineTo(L*0.8, 0); ctx.stroke();
  // hilt
  ctx.fillStyle = '#1a0a0a'; ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-2, -11); ctx.lineTo(-32, -15);
  ctx.lineTo(-48, -13); ctx.lineTo(-48, 13);
  ctx.lineTo(-32, 15); ctx.lineTo(-2, 11);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#333'; ctx.fillRect(-4, -15, 5, 30);
  if(dripping){
    ctx.fillStyle = 'rgba(160,0,0,0.95)';
    for(let i=0;i<7;i++){
      const bx = 30 + i*36 + Math.random()*18;
      const bh = 20 + Math.random()*90;
      const bw = 3 + Math.random()*4;
      ctx.beginPath();
      ctx.moveTo(bx, 7); ctx.lineTo(bx+bw, 7);
      ctx.lineTo(bx+bw*0.6, 7+bh); ctx.lineTo(bx+bw*0.4, 7+bh);
      ctx.closePath(); ctx.fill();
    }
    for(let i=0;i<5;i++){
      const bx = 40 + Math.random()*220;
      const by = 12 + Math.random()*50;
      ctx.beginPath();
      ctx.arc(bx, by, 2+Math.random()*2.5, 0, Math.PI*2); ctx.fill();
    }
  }
  ctx.restore();
}

const knifeEl = document.getElementById('knife');

function knifeSlash(){
  const dur = 700;
  const t0 = performance.now();
  const startX = -100;
  const startY = knifeEl.height * (0.15 + Math.random()*0.7);
  const endX = knifeEl.width + 100;
  const endY = knifeEl.height * (0.15 + Math.random()*0.7);
  const angle = Math.atan2(endY-startY, endX-startX);
  knifeEl.classList.add('on');
  slashSound(); growl(); vibrate([80,40,80]);
  const sm = document.createElement('div');
  sm.className = 'slashmark';
  sm.style.left = Math.min(startX, endX) + 'px';
  sm.style.top = startY + 'px';
  sm.style.width = Math.abs(endX-startX) + 'px';
  sm.style.transform = 'rotate(' + (angle * 180/Math.PI) + 'deg)';
  document.body.appendChild(sm);
  setTimeout(()=>sm.remove(), 1200);
  setTimeout(()=>bloodSplatter(8), 200);
  function loop(){
    const p = (performance.now()-t0)/dur;
    if(p >= 1){ knifeEl.classList.remove('on'); return; }
    knifeCtx.setTransform(1,0,0,1,0,0);
    knifeCtx.clearRect(0,0,knifeEl.width,knifeEl.height);
    const x = startX + (endX-startX)*p;
    const y = startY + (endY-startY)*p;
    drawKnife(knifeCtx, x, y, angle, 1.4, true);
    requestAnimationFrame(loop);
  }
  loop();
}

function knifeStab(){

    knifeCtx.clearRect(0,0,knifeEl.width,knifeEl.height);

function drawCrawler(ctx, x, y, scale, flip){
  ctx.save();
  ctx.translate(x, y);
  if(flip) ctx.scale(-1, 1);
  ctx.scale(scale, scale);
  const s = 200;
  ctx.fillStyle = 'rgba(5,0,0,0.98)';
  ctx.shadowColor = '#ff0033'; ctx.shadowBlur = 35;
  ctx.beginPath();
  ctx.ellipse(0, 0, s*0.55, s*0.22, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(-s*0.55, -s*0.08, s*0.16, 0, Math.PI*2); ctx.fill();
  ctx.lineWidth = s*0.09; ctx.strokeStyle = 'rgba(5,0,0,0.98)'; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-s*0.3, -s*0.05);
  ctx.quadraticCurveTo(-s*0.55, s*0.18, -s*0.85, s*0.22); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-s*0.2, s*0.05);
  ctx.quadraticCurveTo(-s*0.5, s*0.28, -s*0.75, s*0.32); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(s*0.4, -s*0.02);
  ctx.quadraticCurveTo(s*0.65, s*0.15, s*0.85, s*0.28); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(s*0.4, s*0.08);
  ctx.quadraticCurveTo(s*0.68, s*0.22, s*0.9, s*0.35); ctx.stroke();
  ctx.shadowBlur = 30;
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(-s*0.6, -s*0.12, s*0.024, 0, Math.PI*2);
  ctx.arc(-s*0.52, -s*0.14, s*0.024, 0, Math.PI*2);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.restore();
}

function launchCrawler(){
  const dir = Math.random() > .5 ? 1 : -1;

function drawHand(ctx, x, y, angle, scale){
  ctx.save();
  ctx.translate(x, y); ctx.rotate(angle); ctx.scale(scale, scale);
  const s = 200;
  ctx.fillStyle = '#0a0000'; ctx.strokeStyle = '#3a0000'; ctx.lineWidth = 3;
  ctx.shadowColor = '#000'; ctx.shadowBlur = 15;
  ctx.beginPath();
  ctx.moveTo(-s*0.25, 0);
  ctx.quadraticCurveTo(-s*0.3, -s*0.35, -s*0.1, -s*0.55);
  ctx.quadraticCurveTo(0, -s*0.6, s*0.1, -s*0.55);
  ctx.quadraticCurveTo(s*0.3, -s*0.35, s*0.25, 0);
  ctx.quadraticCurveTo(s*0.15, s*0.2, 0, s*0.25);
  ctx.quadraticCurveTo(-s*0.15, s*0.2, -s*0.25, 0);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  const fingers = [
    { x: -s*0.22, len: s*0.5, ang: -0.5 },
    { x: -s*0.08, len: s*0.6, ang: -0.15 },
    { x:  s*0.06, len: s*0.62, ang: 0.05 },
    { x:  s*0.20, len: s*0.55, ang: 0.25 },
  ];
  ctx.lineCap = 'round';
  fingers.forEach(f=>{
    ctx.save();
    ctx.translate(f.x, -s*0.5); ctx.rotate(f.ang);
    ctx.lineWidth = s*0.09; ctx.strokeStyle = '#0a0000';
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -f.len); ctx.stroke();
    ctx.beginPath();
    ctx.arc(0, -f.len, s*0.045, 0, Math.PI*2);
    ctx.fillStyle = '#0a0000'; ctx.fill();
    ctx.restore();
  });
  ctx.save();
  ctx.translate(-s*0.32, -s*0.15); ctx.rotate(-0.9);
  ctx.lineWidth = s*0.1; ctx.strokeStyle = '#0a0000';
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -s*0.32); ctx.stroke();
  ctx.restore();
  ctx.shadowBlur = 0;
  ctx.restore();
}

function launchHands(){
  handsEl.classList.add('on');
  const dur = 4500 + Math.random()*2500;
  const t0 = performance.now();
  breath(0.1); growl();
  const edges = [
    { x: 0, y: handsEl.height*0.5, ang: -Math.PI/2 },
    { x: handsEl.width, y: handsEl.height*0.5, ang: Math.PI/2 },
    { x: handsEl.width*0.5, y: 0, ang: 0 },
    { x: handsEl.width*0.5, y: handsEl.height, ang: Math.PI },
  ];
  const hand = edges[Math.floor(Math.random()*edges.length)];
  function loop(){
    const p = (performance.now()-t0)/dur;
    if(p >= 1){ handsEl.classList.remove('on'); return; }
    handsCtx.setTransform(1,0,0,1,0,0);
    handsCtx.clearRect(0,0,handsEl.width,handsEl.height);
    const reach = Math.sin(p*Math.PI);
    drawHand(handsCtx, hand.x, hand.y, hand.ang, reach * 1.15);
    requestAnimationFrame(loop);
  }
  loop();
}

/* morph */
const morphEl = document.getElementById('morph');
const morphCtx = morphEl.getContext('2d');
let morphActive = false;
function resizeMorph(){ morphEl.width = window.innerWidth; morphEl.height = window.innerHeight; }
resizeMorph();
window.addEventListener('resize', resizeMorph);

function startMorph(duration){
  duration = duration || 12000;
  morphActive = true;
  morphEl.classList.add('on');
  const t0 = performance.now();
  const order = [];
  while(order.length < 6){
    const t = Math.floor(Math.random()*FACE_COUNT);
    if(order[order.length-1] !== t) order.push(t);
  }
  function loop(){
    if(!morphActive) return;
    const p = (performance.now()-t0)/duration;
    if(p >= 1){ morphActive = false; morphEl.classList.remove('on'); return; }
    morphCtx.setTransform(1,0,0,1,0,0);
    morphCtx.fillStyle = '#000';
    morphCtx.fillRect(0,0,morphEl.width,morphEl.height);
    const seg = p * (order.length - 1);
    const idx = Math.min(order.length-2, Math.floor(seg));
    const local = seg - idx;
    const cx = morphEl.width/2, cy = morphEl.height/2;
    const s = Math.min(morphEl.width, morphEl.height) * (1.4 + Math.sin(p*Math.PI)*0.35);
    morphCtx.globalAlpha = 1;
    drawFaceByIndex(morphCtx, cx, cy, s, order[idx]);
    morphCtx.globalAlpha = local;
    drawFaceByIndex(morphCtx, cx, cy, s, order[idx+1]);
    morphCtx.globalAlpha = 1;
    requestAnimationFrame(loop);
  }
  loop();
}

function faceScare(text, duration, type){
  duration = duration || 1600;
  const wrap = document.createElement('div');
  wrap.className = 'scare face';
  const cvs = document.createElement('canvas');
  cvs.className = 'face-cvs';
  wrap.appendChild(cvs);
  if(text){
    const t = document.createElement('div');
    t.className = 'scare-text';
    t.textContent = text;
    wrap.appendChild(t);
  }
  document.body.appendChild(wrap);
  function resize(){ cvs.width = window.innerWidth; cvs.height = window.innerHeight; }
  resize();
  window.addEventListener('resize', resize);
  const ctx = cvs.getContext('2d');
  const t0 = performance.now();
  const faceType = type !== undefined ? type : Math.floor(Math.random()*FACE_COUNT);
  let raf;
  function loop(){
    const p = (performance.now()-t0)/duration;
    if(p >= 1){ cancelAnimationFrame(raf); return; }
    ctx.setTransform(1,0,0,1,0,0);
    ctx.fillStyle = '#000'; ctx.fillRect(0,0,cvs.width,cvs.height);
    const jx = (Math.random()-0.5)*38;
    const jy = (Math.random()-0.5)*38;
    const zoom = 1 + p*0.55;
    const cx = cvs.width/2 + jx;
    const cy = cvs.height/2 + jy;
    const s = Math.min(cvs.width, cvs.height) * zoom;
    drawFaceByIndex(ctx, cx, cy, s, faceType);
    raf = requestAnimationFrame(loop);
  }
  loop();
  scream(); shake(); tear(200);
  vibrate([340, 90, 340, 90, 700]);
  flashRed(200);
  bloodSplatter(4);
  setTimeout(()=>{
    wrap.style.transition = 'opacity .28s';
    wrap.style.opacity = '0';
    setTimeout(()=>{ wrap.remove(); window.removeEventListener('resize', resize); }, 320);
  }, duration);
}

function silenceThenScream(text, mode){
  if(!ac){ scream(); return; }
  const t = ac.currentTime;
  if(droneGain){
    droneGain.gain.cancelScheduledValues(t);
    droneGain.gain.setValueAtTime(droneGain.gain.value, t);
    droneGain.gain.linearRampToValueAtTime(0, t+0.15);
  }
  document.getElementById('blackout').classList.add('on');
  setTimeout(()=>{
    document.getElementById('blackout').classList.remove('on');
    if(droneGain){
      const t2 = ac.currentTime;
      droneGain.gain.cancelScheduledValues(t2);
      droneGain.gain.setValueAtTime(0, t2);
      droneGain.gain.linearRampToValueAtTime(0.06, t2+0.4);
    }
    if(mode === 'face') faceScare(text || 'BEHIND YOU', 1600);
    else jumpscare(text || 'LOOK AT ME', 'flash');
  }, 1800);
}

function cursorEl(){ return term.querySelector('.cursor'); }
function insertBeforeCursor(el){
  const c = cursorEl();
  if(c) term.insertBefore(el, c); else term.appendChild(el);
  screenEl.scrollTop = screenEl.scrollHeight;
}
function addLine(html, cls){
  const d = document.createElement('div');
  d.className = 'line ' + (cls||'');
  d.innerHTML = html;
  insertBeforeCursor(d);
  if(Math.random() > 0.55) blip(700 + Math.random()*700);
}
function typeLine(text, cls, speed){
  return new Promise(res=>{
    const d = document.createElement('div');
    d.className = 'line ' + (cls||'');
    insertBeforeCursor(d);
    let i = 0;
    const step = speed || 22;
    const iv = setInterval(()=>{
      d.textContent = text.slice(0, ++i);
      if(i % 4 === 0 && Math.random() > .65) blip(900 + Math.random()*900);
      if(i >= text.length){ clearInterval(iv); res(); }
    }, step);
  });
}
function sleep(ms){ return new Promise(r=>setTimeout(r, ms)); }

  if(reduceMotion) return;
  screenEl.classList.remove('shake');
  void screenEl.offsetWidth;
  screenEl.classList.add('shake');
  setTimeout(()=>screenEl.classList.remove('shake'), 650);
}

/* ============================================================

function showWebcamCapture(ms){
  ms = ms || 2800;
  const panel = document.createElement('div');
  panel.id = 'webcam-panel';
  panel.innerHTML =
    '<div class="head">' +
      '<span>● LIVE CAM — USER DEVICE</span>' +
      '<span class="rec">● REC</span>' +
    '</div>' +
    '<canvas></canvas>' +
    '<div class="foot">SNAPSHOT SAVED · UPLOADED TO SERVER</div>';
  document.body.appendChild(panel);
  requestAnimationFrame(()=>panel.classList.add('on'));

  const cvs = panel.querySelector('canvas');
  cvs.width = 480; cvs.height = 360;
  const ctx = cvs.getContext('2d');
  const faceType = Math.floor(Math.random()*FACE_COUNT);
  function tick(){
    ctx.setTransform(1,0,0,1,0,0);
    ctx.fillStyle = '#000'; ctx.fillRect(0,0,cvs.width,cvs.height);
    const img = ctx.getImageData(0,0,cvs.width,cvs.height);
    const d = img.data;
    for(let i=0;i<d.length;i+=4){
      const v = Math.random()*95;
      d[i] = v; d[i+1] = v*0.18; d[i+2] = v*0.18; d[i+3] = 255;
    }
    ctx.putImageData(img,0,0);
    ctx.globalAlpha = 0.9;
    drawFaceByIndex(ctx, cvs.width/2, cvs.height/2,
      Math.min(cvs.width,cvs.height)*1.05, faceType);
    ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(255,0,51,0.06)';
    for(let y=0; y<cvs.height; y+=3) ctx.fillRect(0, y, cvs.width, 1);
    ctx.fillStyle = 'rgba(255,50,50,0.85)';
    ctx.font = '10px monospace';
    ctx.fillText(new Date().toISOString().replace('T',' ').slice(0,19), 6, cvs.height-6);
    ctx.strokeStyle = 'rgba(255,0,51,0.7)'; ctx.lineWidth = 2;
    ctx.strokeRect(1,1,cvs.width-2,cvs.height-2);
    requestAnimationFrame(tick);
  }
  tick();
  blip(700); flashRed(100);
  setTimeout(()=>{
    panel.classList.remove('on');
    setTimeout(()=>panel.remove(), 300);
  }, ms);
}
