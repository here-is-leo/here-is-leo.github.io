  <script>
    function renderProjectsPage() {
      var grid = document.getElementById('projects-grid');
      if (!grid) return;

      var lang = (typeof getLang === 'function') ? getLang() : 'fa';
      var data = (typeof SITE !== 'undefined') ? SITE[lang] : null;
      if (!data || !data.projects || !data.projects.items) return;

      var titleEl = document.getElementById('projects-hero-title');
      var subEl = document.getElementById('projects-hero-subtitle');
      if (titleEl) titleEl.textContent = data.projects.title;
      if (subEl) subEl.textContent = data.projects.subtitle;

      var footerEl = document.getElementById('footer-text');
      if (footerEl && data.footer) footerEl.textContent = data.footer;

      grid.innerHTML = data.projects.items.map(function (p, i) {
        var icon = p.icon ? p.icon + ' ' : '';
        var dateHtml = p.date ? '<span class="project-date">' + p.date + '</span>' : '';
        var techHtml = (p.tech && p.tech.length)
          ? '<div class="tech-tags">' + p.tech.map(function (t) { return '<span>' + t + '</span>'; }).join('') + '</div>'
          : '';
        var linkHtml = p.url
          ? '<a href="' + p.url + '" target="_blank" rel="noopener" class="project-link">' +
              (lang === 'fa' ? 'مشاهده در گیت‌هاب ↗' : 'View on GitHub ↗') + '</a>'
          : '';

        return '<div class="project-card reveal reveal-delay-' + (i % 4) + '">' +
                 '<div class="project-head">' +
                   '<h3>' + icon + p.title + '</h3>' +
                   dateHtml +
                 '</div>' +
                 '<p>' + p.desc + '</p>' +
                 techHtml +
                 linkHtml +
               '</div>';
      }).join('');

      setTimeout(function () {
        document.querySelectorAll('.project-card').forEach(function (card, i) {
          setTimeout(function () { card.classList.add('visible'); }, 60 + i * 50);
        });
      }, 100);
    }

    document.addEventListener('DOMContentLoaded', renderProjectsPage);

    document.addEventListener('site:rendered', function (e) {
      if (e.detail && e.detail.page === 'projects') renderProjectsPage();
    });
  </script>
