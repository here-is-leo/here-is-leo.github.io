<body data-page="blog">
  <header class="site-header">
    <nav class="nav">
      <a href="index.html" class="brand">
        <span class="dot"></span>

      </a>
      <ul class="nav-links">

        <li><a href="blog.html" data-nav-blog class="active">وبلاگ</a></li>

      </ul>

  <main>
    <section class="about-hero">
      <div class="container">
        <h1 id="blog-title">وبلاگ</h1>
        <p id="blog-subtitle">نوشته‌ها، آموزش‌ها و تجربه‌های من در دنیای برنامه‌نویسی، امنیت و لینوکس.</p>
      </div>
    </section>

    <section>
      <div class="container">
        <div class="filter-row" id="filter-row">
          <button class="filter-btn active" data-filter="all" data-fa="همه" data-en="All">همه</button>
          <button class="filter-btn" data-filter="امنیت وب" data-fa="🔒 امنیت وب" data-en="🔒 Security">🔒 امنیت وب</button>
          <button class="filter-btn" data-filter="لینوکس" data-fa="🐧 لینوکس" data-en="🐧 Linux">🐧 لینوکس</button>
          <button class="filter-btn" data-filter="برنامه‌نویسی" data-fa="💻 برنامه‌نویسی" data-en="💻 Programming">💻 برنامه‌نویسی</button>
          <button class="filter-btn" data-filter="AI" data-fa="🤖 هوش مصنوعی" data-en="🤖 AI">🤖 هوش مصنوعی</button>
        </div>

        <div class="blog-grid" id="blog-grid"></div>
        <div id="pagination" class="pagination"></div>
      </div>
    </section>
  </main>

  <footer>
    <div class="container" id="footer-text"></div>
  </footer>

  <script src="blog-data.js"></script>
  <script src="content.js"></script>
  <script src="script.js"></script>
  <script>
    let currentFilter = 'all', currentPage = 1;
    const postsPerPage = 6;

    function localizedPost(post) { return post && (post[getLang()] || post.fa || post); }
    function getCategoryIcon(category) {
      const icons = { 'امنیت وب':'🛡️', 'لینوکس':'🐧', 'برنامه‌نویسی':'💻', 'AI':'🤖' };
      return icons[category] || '📝';
    }

    function renderBlog() {
      const blogLang = getLang();
      const bt = document.getElementById('blog-title'), bs = document.getElementById('blog-subtitle');
      if (bt) bt.textContent = blogLang === 'fa' ? 'وبلاگ' : 'Blog';
      if (bs) bs.textContent = blogLang === 'fa' ? 'نوشته‌ها، آموزش‌ها و تجربه‌های من در دنیای برنامه‌نویسی، امنیت و لینوکس.' : 'Notes, tutorials and field experience across programming, security and Linux.';
      document.querySelectorAll('.filter-btn').forEach(btn => { if (btn.dataset.en) btn.textContent = blogLang === 'fa' ? btn.dataset.fa : btn.dataset.en; });
      const grid = document.getElementById('blog-grid');
      if (!grid) return;
      let filtered = blogPosts.filter(p => { const x = localizedPost(p); return currentFilter === 'all' ? true : x.category === currentFilter || x.tags.includes(currentFilter); });
      const totalPages = Math.ceil(filtered.length / postsPerPage);
      const pagePosts = filtered.slice((currentPage-1)*postsPerPage, currentPage*postsPerPage);

      if (!pagePosts.length) {
        grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:60px 20px;"><p style="font-size:1.1rem;color:var(--fg-muted);">${getLang()==='fa'?'هیچ مقاله‌ای در این دسته‌بندی پیدا نشد.':'No posts found in this category.'}</p></div>`;
      } else {
        grid.innerHTML = pagePosts.map((post, i) => { const x = localizedPost(post); return `
          <div class="blog-post-card reveal reveal-delay-${i % 4}" onclick="openPost(${post.id})">
            <div class="post-image">${getCategoryIcon(x.category)}</div>
            <div class="post-meta"><span>${x.date}</span><span>${x.readTime}</span></div>
            <h3 class="post-title">${x.title}</h3>
            <div class="post-tags">${x.tags.map(t => `<span>${t}</span>`).join('')}</div>
            <p class="post-excerpt">${x.excerpt}</p>
            <a href="#" class="post-link" onclick="event.stopPropagation(); openPost(${post.id}); return false;">${getLang()==='fa'?'ادامه مطلب →':'Read more →'}</a>
          </div>
        `; }).join('');
      }

      const pagination = document.getElementById('pagination');
      if (totalPages > 1) {
        pagination.innerHTML = Array.from({length: totalPages}, (_, i) =>
          `<button class="page-btn${i+1===currentPage?' active':''}" data-page="${i+1}">${i+1}</button>`
        ).join('');
        pagination.querySelectorAll('.page-btn').forEach(btn => btn.addEventListener('click', function() {
          currentPage = parseInt(this.dataset.page);
          renderBlog();
          window.scrollTo({ top: document.querySelector('.blog-grid').offsetTop - 100, behavior: 'smooth' });
        }));
      } else pagination.innerHTML = '';

      setTimeout(() => { document.querySelectorAll('.blog-post-card').forEach((c, i) => setTimeout(() => c.classList.add('visible'), 60 + i * 60)); }, 100);
    }

    function initFilters() {
      document.querySelectorAll('.filter-btn').forEach(btn => btn.addEventListener('click', function() {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        currentFilter = this.dataset.filter; currentPage = 1; renderBlog();
      }));
    }

    function openPost(id) {
      const post = blogPosts.find(p => p.id === id), x = localizedPost(post);
      if (!post || !x) return;
      const overlay = document.createElement('div'); overlay.className = 'post-overlay'; overlay.id = 'post-overlay';
      overlay.innerHTML = `
        <div class="post-overlay-content">
          <button class="close-btn" onclick="closePostOverlay()">✕</button>
          <div style="clear:both;"></div>
          <div class="post-tags" style="margin-bottom:14px;">${x.tags.map(t => `<span>${t}</span>`).join('')}</div>
          <h1>${x.title}</h1>
          <div class="post-meta" style="margin-bottom:22px;">${x.date} · ${x.readTime}</div>
          <div class="post-content">${x.content}</div>
        </div>
      `;
      document.body.appendChild(overlay);
      document.body.style.overflow = 'hidden';
      const url = new URL(window.location.href);
      url.searchParams.set('post', id);
      window.history.pushState({}, '', url);
    }

    function closePostOverlay() {
      const overlay = document.getElementById('post-overlay');
      if (overlay) { overlay.remove(); document.body.style.overflow = ''; const url = new URL(window.location.href); url.searchParams.delete('post'); window.history.pushState({}, '', url); }
    }

    document.addEventListener('DOMContentLoaded', function() {
      renderBlog(); initFilters();
      const params = new URLSearchParams(window.location.search);
      const postId = params.get('post');
      if (postId) { const post = blogPosts.find(p => p.id === parseInt(postId)); if (post) setTimeout(() => openPost(post.id), 300); }
    });
    document.addEventListener('site:rendered', function(e) { if (e.detail && e.detail.page === 'blog') renderBlog(); });
  </script>

  <style>
    .filter-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 36px; justify-content: center; }
    .filter-btn {
      padding: 9px 20px; border: 2px solid var(--border); background: transparent;
      color: var(--fg-muted); font-family: var(--font-display); font-size: .78rem;
      font-weight: 800; letter-spacing: .12em; text-transform: uppercase;
      cursor: pointer; transition: all .2s var(--motion);
    }
    .filter-btn:hover { color: var(--fg); transform: translate(-2px,-2px); box-shadow: 3px 3px 0 0 var(--shadow-color); }
    .filter-btn.active { background: var(--bh-red); color: var(--bh-white); border-color: var(--bh-black); box-shadow: 3px 3px 0 0 var(--bh-black); }
    .blog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 24px; }
    .pagination { display: flex; justify-content: center; gap: 10px; margin-top: 40px; }
    .page-btn {
      padding: 10px 18px; border: 2px solid var(--border); background: transparent;
      color: var(--fg); font-family: var(--font-display); font-weight: 800;
      cursor: pointer; transition: all .2s var(--motion);
    }
    .page-btn:hover { transform: translate(-2px,-2px); box-shadow: 3px 3px 0 0 var(--bh-red); }
    .page-btn.active { background: var(--bh-red); color: var(--bh-white); border-color: var(--bh-black); box-shadow: 3px 3px 0 0 var(--bh-black); }
  </style>
