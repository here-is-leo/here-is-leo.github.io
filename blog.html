  <style>
    .blog-post-card {
      background: linear-gradient(160deg, rgba(255,255,255,.04), rgba(255,255,255,.01));
      border: 1px solid var(--border-default);
      border-radius: var(--radius);
      padding: 28px 30px;
      backdrop-filter: blur(14px);
      transition: all .4s cubic-bezier(.22, 1, .36, 1);
      cursor: pointer;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    .blog-post-card:hover { transform: translateY(-6px); border-color: var(--border-hover); box-shadow: var(--shadow-card-hover); }
    .blog-post-card .post-image { width: 100%; height: 180px; border-radius: 10px; margin-bottom: 18px; background: linear-gradient(135deg, rgba(94,106,210,.15), rgba(0,0,0,.3)); display: flex; align-items: center; justify-content: center; font-size: 3.5rem; color: #b8bfff; border: 1px solid var(--border-default); }
    .blog-post-card .post-title { font-size: 1.2rem; font-weight: 700; margin: 0 0 8px; line-height: 1.4; letter-spacing: -0.015em; }
    .blog-post-card .post-meta { display: flex; justify-content: space-between; align-items: center; font-size: .78rem; color: var(--foreground-muted); margin-bottom: 12px; }
    .blog-post-card .post-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .blog-post-card .post-tags span { padding: 3px 12px; border-radius: 999px; border: 1px solid var(--border-accent); background: rgba(94,106,210,.06); color: #b8bfff; font-size: .7rem; font-weight: 500; }
    .blog-post-card .post-excerpt { color: var(--foreground-muted); font-size: .92rem; line-height: 1.9; margin: 0 0 16px; flex: 1; }
    .blog-post-card .post-link { color: #b8bfff; font-size: .85rem; font-weight: 600; transition: color .3s; display: inline-flex; align-items: center; gap: 4px; }
    .blog-post-card .post-link:hover { color: #fff; }
    .post-overlay { position: fixed; inset: 0; z-index: 1000; background: rgba(5,5,6,0.94); backdrop-filter: blur(24px); display: flex; align-items: center; justify-content: center; padding: 40px 20px; animation: fadeIn .4s ease; }
    .post-overlay-content { max-width: 820px; width: 100%; max-height: 90vh; overflow-y: auto; background: var(--background-elevated); border-radius: var(--radius-lg); padding: 44px; border: 1px solid var(--border-default); position: relative; }
    .post-overlay-content .close-btn { position: sticky; top: 0; float: right; background: var(--surface); border: 1px solid var(--border-default); border-radius: 50%; width: 40px; height: 40px; font-size: 1.2rem; cursor: pointer; color: var(--foreground); transition: all .3s; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; }
    .post-overlay-content .close-btn:hover { background: var(--surface-hover); border-color: var(--border-hover); }
    .post-overlay-content h1 { font-size: 2rem; margin: 0 0 8px; letter-spacing: -0.03em; }
    .post-overlay-content .post-content { color: var(--foreground); font-size: 1.05rem; line-height: 2.2; }
    .post-overlay-content .post-content h2 { font-size: 1.5rem; margin: 28px 0 14px; color: #b8bfff; }
    .post-overlay-content .post-content h3 { font-size: 1.2rem; margin: 20px 0 10px; color: #b8bfff; }
    .post-overlay-content .post-content ul, .post-overlay-content .post-content ol { padding-inline-start: 24px; }
    .post-overlay-content .post-content code { background: rgba(255,255,255,0.06); padding: 2px 8px; border-radius: 6px; font-size: .9rem; color: #b8bfff; }
    .post-overlay-content .post-content pre { background: rgba(0,0,0,0.4); padding: 16px 20px; border-radius: 10px; overflow-x: auto; border: 1px solid var(--border-default); margin: 12px 0; }
    .post-overlay-content .post-content pre code { background: transparent; padding: 0; color: #c8cdff; font-size: .85rem; }
    .post-overlay-content .post-content .note { background: rgba(94,106,210,0.08); border-right: 4px solid var(--accent); padding: 14px 20px; border-radius: 8px; margin: 16px 0; }
    .post-overlay-content .post-content .warning { background: rgba(255,107,107,0.08); border-right: 4px solid #ff6b6b; padding: 14px 20px; border-radius: 8px; margin: 16px 0; }
    @keyframes fadeIn { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    .post-overlay-content { animation: slideUp .4s ease; }
    @media (max-width:768px){ .blog-grid { grid-template-columns:1fr !important; } .post-overlay-content { padding:28px 20px; } .post-overlay-content h1 { font-size:1.5rem; } }
  </style>

        <li><a href="resume.html" data-nav-resume>رزومه</a></li>

  <main>
    <section class="about-hero" style="padding: 60px 0 30px;">
      <div class="container">
        <h1 style="font-size: clamp(2.2rem, 5vw, 3.5rem); margin: 0 0 10px; background: linear-gradient(170deg, #fff 28%, rgba(255,255,255,.48)); -webkit-background-clip: text; background-clip: text; color: transparent; font-weight: 700; letter-spacing: -0.04em;">وبلاگ</h1>
        <p style="color: var(--foreground-muted); max-width: 580px; margin: 0 auto; font-size: 1.04rem; line-height: 2;">نوشته‌ها، آموزش‌ها و تجربه‌های من در دنیای برنامه‌نویسی، امنیت و لینوکس.</p>

    <section style="border-top:0; padding-top:0;">
      <div class="container">
        <div style="display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 30px; justify-content: center;">
          <button class="filter-btn active" data-filter="all" style="padding: 8px 20px; border-radius: 999px; border: 1px solid var(--border-accent); background: rgba(94,106,210,.12); color: #b8bfff; font-size: .85rem; font-weight: 500; cursor: pointer; transition: all .3s;">همه</button>
          <button class="filter-btn" data-filter="امنیت وب" style="padding: 8px 20px; border-radius: 999px; border: 1px solid var(--border-accent); background: transparent; color: var(--foreground-muted); font-size: .85rem; font-weight: 500; cursor: pointer; transition: all .3s;">🔒 امنیت وب</button>
          <button class="filter-btn" data-filter="لینوکس" style="padding: 8px 20px; border-radius: 999px; border: 1px solid var(--border-accent); background: transparent; color: var(--foreground-muted); font-size: .85rem; font-weight: 500; cursor: pointer; transition: all .3s;">🐧 لینوکس</button>
          <button class="filter-btn" data-filter="برنامه‌نویسی" style="padding: 8px 20px; border-radius: 999px; border: 1px solid var(--border-accent); background: transparent; color: var(--foreground-muted); font-size: .85rem; font-weight: 500; cursor: pointer; transition: all .3s;">💻 برنامه‌نویسی</button>
          <button class="filter-btn" data-filter="AI" style="padding: 8px 20px; border-radius: 999px; border: 1px solid var(--border-accent); background: transparent; color: var(--foreground-muted); font-size: .85rem; font-weight: 500; cursor: pointer; transition: all .3s;">🤖 هوش مصنوعی</button>
        </div>

        <div class="blog-grid" id="blog-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px;"></div>
        <div id="pagination" style="display: flex; justify-content: center; gap: 10px; margin-top: 40px;"></div>
      </div>
    </section>
  </main>

  <footer>
    <div class="container" id="footer-text"></div>
  </footer>

  <script src="blog-data.js"></script>
  <script src="content.js"></script>
  <script src="script.js"></script>
  <script>
    let currentFilter = 'all', currentPage = 1;
    const postsPerPage = 6;

    function getCategoryIcon(category) {
      const icons = { 'امنیت وب':'🛡️', 'لینوکس':'🐧', 'برنامه‌نویسی':'💻', 'AI':'🤖' };
      return icons[category] || '📝';
    }

    function renderBlog() {
      const grid = document.getElementById('blog-grid');
      if (!grid) return;
      let filtered = blogPosts.filter(p => currentFilter === 'all' ? true : p.category === currentFilter || p.tags.includes(currentFilter));
      const totalPages = Math.ceil(filtered.length / postsPerPage);
      const pagePosts = filtered.slice((currentPage-1)*postsPerPage, currentPage*postsPerPage);

      if (!pagePosts.length) {
        grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--foreground-muted);"><div style="font-size:3rem;margin-bottom:16px;">🔍</div><p style="font-size:1.1rem;">هیچ مقاله‌ای در این دسته‌بندی پیدا نشد.</p></div>`;
      } else {
        grid.innerHTML = pagePosts.map((post, i) => `
          <div class="blog-post-card reveal reveal-delay-${i % 4}" onclick="openPost(${post.id})">
            <div class="post-image">${getCategoryIcon(post.category)}</div>
            <div class="post-meta"><span>${post.date}</span><span>${post.readTime}</span></div>
            <h3 class="post-title">${post.title}</h3>
            <div class="post-tags">${post.tags.map(t => `<span>${t}</span>`).join('')}</div>
            <p class="post-excerpt">${post.excerpt}</p>
            <a href="#" class="post-link" onclick="event.stopPropagation(); openPost(${post.id}); return false;">ادامه مطلب →</a>
          </div>
        `).join('');
      }

      const pagination = document.getElementById('pagination');
      if (totalPages > 1) {
        pagination.innerHTML = Array.from({length: totalPages}, (_, i) => 
          `<button class="page-btn" data-page="${i+1}" style="padding:8px 16px;border-radius:8px;border:1px solid ${i+1===currentPage?'var(--accent)':'var(--border-default)'};background:${i+1===currentPage?'var(--accent)':'transparent'};color:${i+1===currentPage?'#fff':'var(--foreground-muted)'};cursor:pointer;transition:all .3s;font-weight:${i+1===currentPage?'600':'400'};">${i+1}</button>`
        ).join('');
        pagination.querySelectorAll('.page-btn').forEach(btn => btn.addEventListener('click', function() {
          currentPage = parseInt(this.dataset.page);
          renderBlog();
          window.scrollTo({ top: document.querySelector('.blog-grid').offsetTop - 100, behavior: 'smooth' });
        }));
      } else pagination.innerHTML = '';

      setTimeout(() => { document.querySelectorAll('.blog-post-card').forEach((c, i) => setTimeout(() => c.classList.add('visible'), 100 + i * 80)); }, 200);
    }

    function initFilters() {
      document.querySelectorAll('.filter-btn').forEach(btn => btn.addEventListener('click', function() {
        document.querySelectorAll('.filter-btn').forEach(b => { b.style.background='transparent'; b.style.color='var(--foreground-muted)'; b.classList.remove('active'); });
        this.style.background='rgba(94,106,210,.12)'; this.style.color='#b8bfff'; this.classList.add('active');
        currentFilter = this.dataset.filter; currentPage = 1; renderBlog();
      }));
    }

    function openPost(id) {
      const post = blogPosts.find(p => p.id === id);
      if (!post) return;
      const overlay = document.createElement('div'); overlay.className = 'post-overlay'; overlay.id = 'post-overlay';
      overlay.innerHTML = `
        <div class="post-overlay-content">
          <button class="close-btn" onclick="closePostOverlay()">✕</button>
          <div style="clear:both;"></div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;">${post.tags.map(t => `<span style="padding:2px 12px;border-radius:999px;border:1px solid var(--border-accent);background:rgba(94,106,210,.08);color:#b8bfff;font-size:.75rem;">${t}</span>`).join('')}</div>
          <h1>${post.title}</h1>
          <div style="color:var(--foreground-muted);font-size:.85rem;margin-bottom:20px;">${post.date} · ${post.readTime}</div>
          <div class="post-content">${post.content}</div>
        </div>
      `;
      document.body.appendChild(overlay);
      document.body.style.overflow = 'hidden';
      const url = new URL(window.location.href);
      url.searchParams.set('post', id);
      window.history.pushState({}, '', url);
    }

    function closePostOverlay() {
      const overlay = document.getElementById('post-overlay');
      if (overlay) { overlay.remove(); document.body.style.overflow = ''; const url = new URL(window.location.href); url.searchParams.delete('post'); window.history.pushState({}, '', url); }
    }

    document.addEventListener('DOMContentLoaded', function() {
      renderBlog(); initFilters();
      const params = new URLSearchParams(window.location.search);
      const postId = params.get('post');
      if (postId) { const post = blogPosts.find(p => p.id === parseInt(postId)); if (post) setTimeout(() => openPost(post.id), 300); }
    });
  </script>
