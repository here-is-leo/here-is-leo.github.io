  <style>
    /* Blog specific styles */
    .blog-post-card {
      background: linear-gradient(160deg, rgba(255,255,255,.04), rgba(255,255,255,.01));
      border: 1px solid var(--border-default);
      border-radius: var(--radius);
      padding: 28px 30px;
      backdrop-filter: blur(14px);
      transition: all .4s cubic-bezier(.22, 1, .36, 1);
      cursor: pointer;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    
    .blog-post-card:hover {
      transform: translateY(-6px);
      border-color: var(--border-hover);
      box-shadow: var(--shadow-card-hover);
    }
    
    .blog-post-card .post-image {
      width: 100%;
      height: 180px;
      border-radius: 10px;
      margin-bottom: 18px;
      background: linear-gradient(135deg, rgba(94,106,210,.15), rgba(0,0,0,.3));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.5rem;
      color: #b8bfff;
      border: 1px solid var(--border-default);
    }
    
    .blog-post-card .post-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin: 0 0 8px;
      line-height: 1.4;
      letter-spacing: -0.015em;
    }
    
    .blog-post-card .post-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: .78rem;
      color: var(--foreground-muted);
      margin-bottom: 12px;
    }
    
    .blog-post-card .post-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 14px;
    }
    
    .blog-post-card .post-tags span {
      padding: 3px 12px;
      border-radius: 999px;
      border: 1px solid var(--border-accent);
      background: rgba(94, 106, 210, .06);
      color: #b8bfff;
      font-size: .7rem;
      font-weight: 500;
    }
    
    .blog-post-card .post-excerpt {
      color: var(--foreground-muted);
      font-size: .92rem;
      line-height: 1.9;
      margin: 0 0 16px;
      flex: 1;
    }
    
    .blog-post-card .post-link {
      color: #b8bfff;
      font-size: .85rem;
      font-weight: 600;
      transition: color .3s;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    
    .blog-post-card .post-link:hover {
      color: #fff;
    }
    
    /* Post Overlay */
    .post-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(5,5,6,0.94);
      backdrop-filter: blur(24px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      animation: fadeIn 0.4s ease;
    }
    
    .post-overlay-content {
      max-width: 820px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      background: var(--background-elevated);
      border-radius: var(--radius-lg);
      padding: 44px;
      border: 1px solid var(--border-default);
      position: relative;
    }
    
    .post-overlay-content .close-btn {
      position: sticky;
      top: 0;
      float: right;
      background: var(--surface);
      border: 1px solid var(--border-default);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 1.2rem;
      cursor: pointer;
      color: var(--foreground);
      transition: all .3s;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }
    
    .post-overlay-content .close-btn:hover {
      background: var(--surface-hover);
      border-color: var(--border-hover);
    }
    
    .post-overlay-content h1 {
      font-size: 2rem;
      margin: 0 0 8px;
      letter-spacing: -0.03em;
    }
    
    .post-overlay-content .post-content {
      color: var(--foreground);
      font-size: 1.05rem;
      line-height: 2.2;
    }
    
    .post-overlay-content .post-content h2 {
      font-size: 1.5rem;
      margin: 28px 0 14px;
      color: #b8bfff;
    }
    
    .post-overlay-content .post-content h3 {
      font-size: 1.2rem;
      margin: 20px 0 10px;
      color: #b8bfff;
    }
    
    .post-overlay-content .post-content ul,
    .post-overlay-content .post-content ol {
      padding-inline-start: 24px;
    }
    
    .post-overlay-content .post-content li {
      margin-bottom: 4px;
    }
    
    .post-overlay-content .post-content code {
      background: rgba(255,255,255,0.06);
      padding: 2px 8px;
      border-radius: 6px;
      font-size: .9rem;
      color: #b8bfff;
    }
    
    .post-overlay-content .post-content pre {
      background: rgba(0,0,0,0.4);
      padding: 16px 20px;
      border-radius: 10px;
      overflow-x: auto;
      border: 1px solid var(--border-default);
      margin: 12px 0;
    }
    
    .post-overlay-content .post-content pre code {
      background: transparent;
      padding: 0;
      color: #c8cdff;
      font-size: .85rem;
    }
    
    .post-overlay-content .post-content .note {
      background: rgba(94, 106, 210, 0.08);
      border-right: 4px solid var(--accent);
      padding: 14px 20px;
      border-radius: 8px;
      margin: 16px 0;
    }
    
    .post-overlay-content .post-content .warning {
      background: rgba(255, 107, 107, 0.08);
      border-right: 4px solid #ff6b6b;
      padding: 14px 20px;
      border-radius: 8px;
      margin: 16px 0;
    }
    
    .post-overlay-content .post-content table {
      width: 100%;
      border-collapse: collapse;
      margin: 16px 0;
    }
    
    .post-overlay-content .post-content th,
    .post-overlay-content .post-content td {
      padding: 10px 14px;
      border: 1px solid var(--border-default);
      text-align: right;
    }
    
    .post-overlay-content .post-content th {
      background: rgba(255,255,255,0.04);
      font-weight: 600;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.97); }
      to { opacity: 1; transform: scale(1); }
    }
    
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .post-overlay-content {
      animation: slideUp 0.4s ease;
    }
    
    /* Responsive */
    @media (max-width: 768px) {
      .blog-grid {
        grid-template-columns: 1fr !important;
      }
      
      .post-overlay-content {
        padding: 28px 20px;
      }
      
      .post-overlay-content h1 {
        font-size: 1.5rem;
      }
    }
  </style>

  <script src="blog-data.js"></script>
  <script>
    // ============================================================
    // STATE
    // ============================================================
    let currentFilter = 'all';
    let currentPage = 1;
    const postsPerPage = 6;

    // ============================================================
    // EMOJI TO ICON
    // ============================================================
    function getCategoryIcon(category) {
      const icons = {
        'امنیت وب': '🛡️',
        'لینوکس': '🐧',
        'برنامه‌نویسی': '💻',
        'AI': '🤖'
      };
      return icons[category] || '📝';
    }

    // ============================================================
    // RENDER BLOG
    // ============================================================
    function renderBlog() {
      const grid = document.getElementById('blog-grid');
      if (!grid) return;

      let filteredPosts = blogPosts;
      if (currentFilter !== 'all') {
        filteredPosts = blogPosts.filter(post => 
          post.category === currentFilter || post.tags.includes(currentFilter)
        );
      }

      const totalPages = Math.ceil(filteredPosts.length / postsPerPage);
      const startIndex = (currentPage - 1) * postsPerPage;
      const endIndex = startIndex + postsPerPage;
      const pagePosts = filteredPosts.slice(startIndex, endIndex);

      if (pagePosts.length === 0) {
        grid.innerHTML = `
          <div style="grid-column: 1/-1; text-align: center; padding: 60px 20px; color: var(--foreground-muted);">
            <div style="font-size: 3rem; margin-bottom: 16px;">🔍</div>
            <p style="font-size: 1.1rem;">هیچ مقاله‌ای در این دسته‌بندی پیدا نشد.</p>
          </div>
        `;
      } else {
        grid.innerHTML = pagePosts.map((post, i) => `
          <div class="blog-post-card reveal reveal-delay-${i % 4}" onclick="openPost(${post.id})">
            <div class="post-image">${getCategoryIcon(post.category)}</div>
            <div class="post-meta">
              <span>${post.date}</span>
              <span>${post.readTime}</span>
            </div>
            <h3 class="post-title">${post.title}</h3>
            <div class="post-tags">
              ${post.tags.map(tag => `<span>${tag}</span>`).join('')}
            </div>
            <p class="post-excerpt">${post.excerpt}</p>
            <a href="#" class="post-link" onclick="event.stopPropagation(); openPost(${post.id}); return false;">ادامه مطلب →</a>
          </div>
        `).join('');
      }

      renderPagination(totalPages);

      setTimeout(() => {
        document.querySelectorAll('.blog-post-card').forEach((card, i) => {
          setTimeout(() => card.classList.add('visible'), 100 + i * 80);
        });
      }, 200);
    }

    // ============================================================
    // RENDER PAGINATION
    // ============================================================
    function renderPagination(totalPages) {
      const container = document.getElementById('pagination');
      if (!container || totalPages <= 1) {
        container.innerHTML = '';
        return;
      }

      let html = '';
      for (let i = 1; i <= totalPages; i++) {
        html += `<button class="page-btn" data-page="${i}" style="padding: 8px 16px; border-radius: 8px; border: 1px solid ${i === currentPage ? 'var(--accent)' : 'var(--border-default)'}; background: ${i === currentPage ? 'var(--accent)' : 'transparent'}; color: ${i === currentPage ? '#fff' : 'var(--foreground-muted)'}; cursor: pointer; transition: all .3s; font-weight: ${i === currentPage ? '600' : '400'};">${i}</button>`;
      }
      container.innerHTML = html;

      container.querySelectorAll('.page-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          currentPage = parseInt(this.dataset.page);
          renderBlog();
          window.scrollTo({ top: document.querySelector('.blog-grid').offsetTop - 100, behavior: 'smooth' });
        });
      });
    }

    // ============================================================
    // FILTER
    // ============================================================
    function initFilters() {
      const buttons = document.querySelectorAll('.filter-btn');
      buttons.forEach(btn => {
        btn.addEventListener('click', function() {
          buttons.forEach(b => {
            b.style.background = 'transparent';
            b.style.color = 'var(--foreground-muted)';
            b.classList.remove('active');
          });
          this.style.background = 'rgba(94, 106, 210, .12)';
          this.style.color = '#b8bfff';
          this.classList.add('active');
          
          currentFilter = this.dataset.filter;
          currentPage = 1;
          renderBlog();
        });
      });
    }

    // ============================================================
    // OPEN POST
    // ============================================================
    function openPost(id) {
      const post = blogPosts.find(p => p.id === id);
      if (!post) return;
      
      const url = new URL(window.location.href);
      url.searchParams.set('post', id);
      window.history.pushState({}, '', url);
      
      showPostOverlay(post);
    }

    function showPostOverlay(post) {
      const overlay = document.createElement('div');
      overlay.className = 'post-overlay';
      overlay.id = 'post-overlay';
      
      overlay.innerHTML = `
        <div class="post-overlay-content">
          <button class="close-btn" onclick="closePostOverlay()">✕</button>
          <div style="clear: both;"></div>
          <div style="display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px;">
            ${post.tags.map(tag => `<span style="padding: 2px 12px; border-radius: 999px; border: 1px solid var(--border-accent); background: rgba(94, 106, 210, .08); color: #b8bfff; font-size: .75rem;">${tag}</span>`).join('')}
          </div>
          <h1>${post.title}</h1>
          <div style="color: var(--foreground-muted); font-size: .85rem; margin-bottom: 20px;">${post.date} · ${post.readTime}</div>
          <div class="post-content">
            ${post.content}
          </div>
        </div>
      `;
      
      document.body.appendChild(overlay);
      document.body.style.overflow = 'hidden';
    }

    function closePostOverlay() {
      const overlay = document.getElementById('post-overlay');
      if (overlay) {
        overlay.remove();
        document.body.style.overflow = '';
        const url = new URL(window.location.href);
        url.searchParams.delete('post');
        window.history.pushState({}, '', url);
      }
    }

    // ============================================================
    // CHECK URL FOR POST ID
    // ============================================================
    function checkUrlForPost() {
      const params = new URLSearchParams(window.location.search);
      const postId = params.get('post');
      if (postId) {
        const post = blogPosts.find(p => p.id === parseInt(postId));
        if (post) {
          setTimeout(() => showPostOverlay(post), 300);
        }
      }
    }

    // ============================================================
    // INIT
    // ============================================================
    document.addEventListener('DOMContentLoaded', function() {
      renderBlog();
      initFilters();
      checkUrlForPost();

      const footer = document.getElementById('footer-text');
      if (footer) footer.textContent = '© ' + new Date().getFullYear() + ' ایلیا فراهانی';
    });
  </script>
