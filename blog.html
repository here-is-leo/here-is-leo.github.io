  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="blog">
  <div class="bg-ambient">
    <div class="orb"></div>
    <div class="orb"></div>
    <div class="orb"></div>
  </div>

  <header class="site-header">
    <nav class="nav">
      <a href="index.html" class="brand"><span class="dot"></span><span data-nav-home>خانه</span></a>
      <ul class="nav-links">
        <li><a href="index.html#skills" data-nav-skills>مهارت‌ها</a></li>
        <li><a href="index.html#projects" data-nav-projects>پروژه‌ها</a></li>
        <li><a href="blog.html" data-nav-blog class="active">وبلاگ</a></li>
        <li><a href="repos.html" data-nav-repos>ریپوها</a></li>
        <li><a href="about.html" data-nav-about>درباره من</a></li>
      </ul>
      <div class="nav-actions">
        <button class="theme-toggle" data-theme-toggle aria-label="تغییر تم"><span class="theme-icon">☼</span></button>
        <button class="lang-toggle" data-lang-toggle>EN</button>
        <button class="nav-toggle" aria-label="menu">☰</button>
      </div>
    </nav>
  </header>

  <main>
    <!-- HERO -->
    <section class="about-hero" style="padding: 60px 0 30px;">
      <div class="container">
        <h1 style="font-size: clamp(2.2rem, 5vw, 3.5rem); margin: 0 0 10px; background: linear-gradient(170deg, #fff 28%, rgba(255,255,255,.48)); -webkit-background-clip: text; background-clip: text; color: transparent; font-weight: 700; letter-spacing: -0.04em;">وبلاگ</h1>
        <p style="color: var(--foreground-muted); max-width: 580px; margin: 0 auto; font-size: 1.04rem; line-height: 2;">نوشته‌ها، آموزش‌ها و تجربه‌های من در دنیای برنامه‌نویسی، امنیت و لینوکس.</p>
      </div>
    </section>

    <!-- BLOG POSTS -->
    <section style="border-top:0; padding-top:0;">
      <div class="container">
        <div class="blog-grid" id="blog-grid">
          <!-- پست‌ها توسط جاوااسکریپت ساخته می‌شوند -->
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="container" id="footer-text"></div>
  </footer>

  <script>
    // ============================================================
    // BLOG DATA
    // ============================================================
    const blogPosts = [
      {
        title: "آشنایی با چالش‌های امنیتی OverTheWire",
        date: "شهریور ۱۴۰۵",
        excerpt: "در این مقاله به بررسی سری چالش‌های OverTheWire، به خصوص Natas، و اهمیت آن در یادگیری امنیت وب می‌پردازیم.",
        tags: ["امنیت وب", "Natas", "CTF"],
        readTime: "۵ دقیقه"
      },
      {
        title: "لینوکس برای برنامه‌نویسان: از صفر تا صد",
        date: "مرداد ۱۴۰۵",
        excerpt: "هر آنچه یک برنامه‌نویس باید درباره لینوکس بداند — از خط فرمان تا bash scripting و مدیریت سرور.",
        tags: ["لینوکس", "برنامه‌نویسی", "سرور"],
        readTime: "۸ دقیقه"
      },
      {
        title: "آشنایی با ابزارهای تست نفوذ در Kali Linux",
        date: "مرداد ۱۴۰۵",
        excerpt: "معرفی ابزارهای کلیدی Kali Linux برای تست نفوذ — Nmap، Metasploit، Wireshark و Burp Suite.",
        tags: ["Kali Linux", "تست نفوذ", "امنیت"],
        readTime: "۱۰ دقیقه"
      },
      {
        title: "مقدمه‌ای بر مهندسی پرامپت برای توسعه‌دهندگان",
        date: "تیر ۱۴۰۵",
        excerpt: "چگونه با طراحی پرامپت‌های دقیق، از مدل‌های زبانی بزرگ برای بهبود کدنویسی و توسعه استفاده کنیم.",
        tags: ["مهندسی پرامپت", "AI", "LLM"],
        readTime: "۶ دقیقه"
      },
      {
        title: "بررسی آسیب‌پذیری‌های رایج وب (OWASP Top 10)",
        date: "خرداد ۱۴۰۵",
        excerpt: "نگاهی به ۱۰ آسیب‌پذیری برتر وب و راهکارهای مقابله با هر کدام با مثال‌های عملی.",
        tags: ["OWASP", "امنیت وب", "آسیب‌پذیری"],
        readTime: "۱۲ دقیقه"
      },
      {
        title: "چرا C# (MVC) برای توسعه وب انتخاب خوبی است؟",
        date: "خرداد ۱۴۰۵",
        excerpt: "مزایای استفاده از معماری MVC در C# برای توسعه وب‌اپلیکیشن‌های مقیاس‌پذیر و امن.",
        tags: ["C#", "MVC", "توسعه وب"],
        readTime: "۷ دقیقه"
      }
    ];

    // ============================================================
    // RENDER BLOG
    // ============================================================
    function renderBlog() {
      const grid = document.getElementById('blog-grid');
      if (!grid) return;

      grid.innerHTML = blogPosts.map((post, i) => `
        <div class="blog-card reveal reveal-delay-${i % 4}" style="background: linear-gradient(160deg, rgba(255,255,255,.035), rgba(255,255,255,.008)); border: 1px solid var(--border-default); border-radius: var(--radius); padding: 28px 26px; backdrop-filter: blur(14px); transition: all .45s var(--transition); cursor: pointer;">
          <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 12px;">
            <h3 style="margin: 0; font-size: 1.15rem; font-weight: 600; letter-spacing: -0.015em;">${post.title}</h3>
            <span style="font-size: .68rem; color: var(--foreground-muted); background: var(--surface); padding: 2px 12px; border-radius: 999px; white-space: nowrap; border: 1px solid var(--border-default);">${post.readTime}</span>
          </div>
          <p style="color: var(--foreground-muted); font-size: .9rem; line-height: 1.8; margin: 0 0 16px 0;">${post.excerpt}</p>
          <div style="display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px;">
            ${post.tags.map(tag => `<span style="padding: 3px 11px; border-radius: 999px; border: 1px solid var(--border-accent); background: rgba(94, 106, 210, .05); color: #b8bfff; font-size: .7rem; font-weight: 500;">${tag}</span>`).join('')}
          </div>
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <span style="font-size: .72rem; color: var(--foreground-muted);">${post.date}</span>
            <a href="#" style="color: #b8bfff; font-size: .82rem; font-weight: 600; transition: color .35s var(--transition);">ادامه مطلب →</a>
          </div>
        </div>
      `).join('');

      // Reveal animation
      setTimeout(() => {
        document.querySelectorAll('.blog-card').forEach((card, i) => {
          setTimeout(() => card.classList.add('visible'), 100 + i * 80);
        });
      }, 200);
    }

    // ============================================================
    // NAV
    // ============================================================
    document.addEventListener('DOMContentLoaded', function() {
      renderBlog();

      // Footer
      const footer = document.getElementById('footer-text');
      if (footer) footer.textContent = '© ' + new Date().getFullYear() + ' ایلیا فراهانی';
    });
  </script>
</body>
</html>
