          <button class="filter-btn" data-filter="لینوکس" style="padding: 8px 20px; border-radius: 999px; border: 1px solid var(--border-accent); background: transparent; color: var(--foreground-muted); font-size: .85rem; font-weight: 500; cursor: pointer; transition: all .3s;">🐧 لینوکس</button>
          <button class="filter-btn" data-filter="برنامه‌نویسی" style="padding: 8px 20px; border-radius: 999px; border: 1px solid var(--border-accent); background: transparent; color: var(--foreground-muted); font-size: .85rem; font-weight: 500; cursor: pointer; transition: all .3s;">💻 برنامه‌نویسی</button>
          <button class="filter-btn" data-filter="AI" style="padding: 8px 20px; border-radius: 999px; border: 1px solid var(--border-accent); background: transparent; color: var(--foreground-muted); font-size: .85rem; font-weight: 500; cursor: pointer; transition: all .3s;">🤖 هوش مصنوعی</button>
        </div>

        <!-- پست‌ها -->
        <div class="blog-grid" id="blog-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px;">
          <!-- پست‌ها توسط جاوااسکریپت ساخته می‌شوند -->

        <!-- Pagination -->

        readTime: "۸ دقیقه",
        image: "https://placehold.co/600x300/0D1117/0077FF?text=Linux"
      },
      {
        id: 3,
        title: "آشنایی با ابزارهای تست نفوذ در Kali Linux",
        date: "مرداد ۱۴۰۵",
        excerpt: "معرفی ابزارهای کلیدی Kali Linux برای تست نفوذ — Nmap، Metasploit، Wireshark و Burp Suite. با این ابزارها می‌توانید آسیب‌پذیری‌های سیستم‌های خود را شناسایی کنید.",

        content: "محتوای کامل مقاله اینجا قرار می‌گیرد...",
        tags: ["C#", "MVC", "توسعه وب"],
        category: "برنامه‌نویسی",
        readTime: "۷ دقیقه",
        image: "https://placehold.co/600x300/0D1117/0077FF?text=C%23+MVC"
      },
      {
        id: 7,
        title: "چگونه یک اسکنر آسیب‌پذیری با Python بسازیم؟",
        date: "خرداد ۱۴۰۵",
        excerpt: "آموزش گام‌به‌گام ساخت یک اسکنر آسیب‌پذیری ساده با Python برای شناسایی SQL Injection و XSS. این پروژه به شما کمک می‌کند تا مفاهیم امنیت را عمیق‌تر درک کنید.",
        content: "محتوای کامل مقاله اینجا قرار می‌گیرد...",
        tags: ["Python", "امنیت وب", "ابزارسازی"],
        category: "برنامه‌نویسی",
        readTime: "۹ دقیقه",
        image: "https://placehold.co/600x300/0D1117/00FF41?text=Python+Scanner"
      },
      {
        id: 8,
        title: "معرفی بهترین توزیع‌های لینوکس برای برنامه‌نویسان",
        date: "اردیبهشت ۱۴۰۵",
        excerpt: "بررسی و مقایسه بهترین توزیع‌های لینوکس برای برنامه‌نویسی — Ubuntu، Fedora، Arch و Kali Linux. هر کدام چه مزایا و معایبی دارند؟",
        content: "محتوای کامل مقاله اینجا قرار می‌گیرد...",
        tags: ["لینوکس", "توزیع", "برنامه‌نویسی"],
        category: "لینوکس",
        readTime: "۶ دقیقه",
        image: "https://placehold.co/600x300/0D1117/FFD700?text=Linux+Distros"
      }
    ];

    // ============================================================
    // STATE
    // ============================================================
    let currentFilter = 'all';
    let currentPage = 1;
    const postsPerPage = 4;

    // ============================================================
    // RENDER BLOG
    // ============================================================
    function renderBlog() {
      const grid = document.getElementById('blog-grid');
      if (!grid) return;

      // فیلتر کردن پست‌ها
      let filteredPosts = blogPosts;
      if (currentFilter !== 'all') {
        filteredPosts = blogPosts.filter(post => 
          post.category === currentFilter || post.tags.includes(currentFilter)
        );
      }

      // Pagination
      const totalPages = Math.ceil(filteredPosts.length / postsPerPage);
      const startIndex = (currentPage - 1) * postsPerPage;
      const endIndex = startIndex + postsPerPage;
      const pagePosts = filteredPosts.slice(startIndex, endIndex);

      // رندر پست‌ها
      grid.innerHTML = pagePosts.map((post, i) => `
        <div class="blog-card reveal reveal-delay-${i % 4}" style="background: linear-gradient(160deg, rgba(255,255,255,.035), rgba(255,255,255,.008)); border: 1px solid var(--border-default); border-radius: var(--radius); overflow: hidden; backdrop-filter: blur(14px); transition: all .45s var(--transition); cursor: pointer;">
          <div style="width: 100%; height: 160px; background: linear-gradient(135deg, rgba(94,106,210,.15), rgba(0,0,0,.3)); display: flex; align-items: center; justify-content: center; font-size: 3rem; color: #b8bfff; font-weight: 700; border-bottom: 1px solid var(--border-default);">
            ${post.tags[0] || '📝'}
          </div>
          <div style="padding: 24px 26px;">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 10px;">
              <h3 style="margin: 0; font-size: 1.1rem; font-weight: 600; letter-spacing: -0.015em; line-height: 1.4;">${post.title}</h3>
              <span style="font-size: .65rem; color: var(--foreground-muted); background: var(--surface); padding: 2px 12px; border-radius: 999px; white-space: nowrap; border: 1px solid var(--border-default);">${post.readTime}</span>
            </div>
            <div style="display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px;">
              ${post.tags.map(tag => `<span style="padding: 2px 10px; border-radius: 999px; border: 1px solid var(--border-accent); background: rgba(94, 106, 210, .05); color: #b8bfff; font-size: .65rem; font-weight: 500;">${tag}</span>`).join('')}
            </div>
            <p style="color: var(--foreground-muted); font-size: .88rem; line-height: 1.8; margin: 0 0 14px 0;">${post.excerpt}</p>
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <span style="font-size: .7rem; color: var(--foreground-muted);">${post.date}</span>
              <a href="#" onclick="openPost(${post.id}); return false;" style="color: #b8bfff; font-size: .8rem; font-weight: 600; transition: color .35s var(--transition);">ادامه مطلب →</a>
            </div>
          </div>
        </div>
      `).join('');

      // رندر Pagination
      renderPagination(totalPages);

      // Reveal animation
      setTimeout(() => {
        document.querySelectorAll('.blog-card').forEach((card, i) => {
          setTimeout(() => card.classList.add('visible'), 100 + i * 80);
        });
      }, 200);
    }

    // ============================================================
    // RENDER PAGINATION
    // ============================================================
    function renderPagination(totalPages) {
      const container = document.getElementById('pagination');
      if (!container || totalPages <= 1) {
        container.innerHTML = '';
        return;
      }

      let html = '';
      for (let i = 1; i <= totalPages; i++) {
        html += `<button class="page-btn" data-page="${i}" style="padding: 8px 16px; border-radius: 8px; border: 1px solid ${i === currentPage ? 'var(--accent)' : 'var(--border-default)'}; background: ${i === currentPage ? 'var(--accent)' : 'transparent'}; color: ${i === currentPage ? '#fff' : 'var(--foreground-muted)'}; cursor: pointer; transition: all .3s; font-weight: ${i === currentPage ? '600' : '400'};">${i}</button>`;
      }
      container.innerHTML = html;

      container.querySelectorAll('.page-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          currentPage = parseInt(this.dataset.page);
          renderBlog();
          window.scrollTo({ top: document.querySelector('.blog-grid').offsetTop - 100, behavior: 'smooth' });
        });
      });
    }

    // ============================================================
    // FILTER
    // ============================================================
    function initFilters() {
      const buttons = document.querySelectorAll('.filter-btn');
      buttons.forEach(btn => {
        btn.addEventListener('click', function() {
          buttons.forEach(b => {
            b.style.background = 'transparent';
            b.style.color = 'var(--foreground-muted)';
            b.classList.remove('active');
          });
          this.style.background = 'rgba(94, 106, 210, .15)';
          this.style.color = '#b8bfff';
          this.classList.add('active');
          
          currentFilter = this.dataset.filter;
          currentPage = 1;
          renderBlog();
        });
      });
    }

    // ============================================================
    // OPEN POST
    // ============================================================
    function openPost(id) {
      const post = blogPosts.find(p => p.id === id);
      if (!post) return;
      
      // ساخت URL با پارامتر
      const url = new URL(window.location.href);
      url.searchParams.set('post', id);
      window.history.pushState({}, '', url);
      
      // نمایش پست به صورت overlay
      showPostOverlay(post);
    }

    function showPostOverlay(post) {
      const overlay = document.createElement('div');
      overlay.id = 'post-overlay';
      overlay.style.cssText = `
        position: fixed; inset: 0; z-index: 1000;
        background: rgba(5,5,6,0.92);
        backdrop-filter: blur(20px);
        display: flex; align-items: center; justify-content: center;
        padding: 40px 20px;
        animation: fadeIn 0.4s ease;
      `;
      
      overlay.innerHTML = `
        <div style="max-width: 720px; width: 100%; max-height: 90vh; overflow-y: auto; background: var(--background-elevated); border-radius: var(--radius-lg); padding: 40px; border: 1px solid var(--border-default); position: relative;">
          <button onclick="closePostOverlay()" style="position: absolute; top: 16px; right: 16px; background: var(--surface); border: 1px solid var(--border-default); border-radius: 50%; width: 40px; height: 40px; font-size: 1.2rem; cursor: pointer; color: var(--foreground); transition: all .3s;">✕</button>
          <div style="margin-bottom: 16px; display: flex; gap: 8px; flex-wrap: wrap;">
            ${post.tags.map(tag => `<span style="padding: 2px 12px; border-radius: 999px; border: 1px solid var(--border-accent); background: rgba(94, 106, 210, .08); color: #b8bfff; font-size: .75rem;">${tag}</span>`).join('')}
          </div>
          <h1 style="margin: 0 0 8px; font-size: 1.8rem; letter-spacing: -0.03em;">${post.title}</h1>
          <div style="color: var(--foreground-muted); font-size: .85rem; margin-bottom: 20px;">${post.date} · ${post.readTime}</div>
          <div style="color: var(--foreground); font-size: 1.05rem; line-height: 2;">
            <p>${post.content || 'محتوای کامل این مقاله در حال آماده‌سازی است...'}</p>
            <p style="color: var(--foreground-muted); font-size: 0.9rem; margin-top: 20px; padding: 16px; border-radius: 10px; background: rgba(255,255,255,0.03); border: 1px solid var(--border-default);">
              💡 این مقاله به‌زودی تکمیل می‌شود. در خبرنامه عضو شوید تا از انتشار آن مطلع شوید.
            </p>
          </div>
        </div>
      `;
      
      document.body.appendChild(overlay);
      document.body.style.overflow = 'hidden';
    }

    function closePostOverlay() {
      const overlay = document.getElementById('post-overlay');
      if (overlay) {
        overlay.remove();
        document.body.style.overflow = '';
        const url = new URL(window.location.href);
        url.searchParams.delete('post');
        window.history.pushState({}, '', url);
      }
    }

    // ============================================================
    // CHECK URL FOR POST ID
    // ============================================================
    function checkUrlForPost() {
      const params = new URLSearchParams(window.location.search);
      const postId = params.get('post');
      if (postId) {
        const post = blogPosts.find(p => p.id === parseInt(postId));
        if (post) {
          setTimeout(() => showPostOverlay(post), 300);
        }
      }
    }

    // ============================================================
    // INIT
    // ============================================================
    document.addEventListener('DOMContentLoaded', function() {
      renderBlog();
      initFilters();
      checkUrlForPost();

      // Footer
      const footer = document.getElementById('footer-text');
      if (footer) footer.textContent = '© ' + new Date().getFullYear() + ' ایلیا فراهانی';
    });
  </script>
</body>
