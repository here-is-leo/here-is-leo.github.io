<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title">
<title id="title">Ilia Farahani — backend developer and security-minded engineer.</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#1f1913"/>
<stop offset="1" stop-color="#171310"/>
</linearGradient>
<radialGradient id="glow" cx="0.82" cy="0.28" r="0.6">
<stop offset="0" stop-color="#c9a769" stop-opacity="0.16"/>
<stop offset="1" stop-color="#c9a769" stop-opacity="0"/>
</radialGradient>
<linearGradient id="hair" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#c9a769" stop-opacity="0"/>
<stop offset="0.5" stop-color="#c9a769"/>
<stop offset="1" stop-color="#c9a769" stop-opacity="0"/>
</linearGradient>
</defs>
<style>
.serif{font-family:'Georgia','Times New Roman',serif}
.sans{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
</style>
<rect width="1200" height="600" fill="url(#bg)"/>
<rect width="1200" height="600" fill="url(#glow)"/>
<rect x="0.5" y="0.5" width="1199" height="599" fill="none" stroke="#3a3124" stroke-width="1"/>

<!-- top kicker -->
<text x="600" y="98" text-anchor="middle" class="sans" font-size="12" letter-spacing="4" fill="#a58f66">BACKEND DEVELOPMENT &#8226; APPLICATION SECURITY &#8226; LINUX</text>

<rect x="560" y="122" width="80" height="1" fill="url(#hair)"/>

<!-- name -->
<text x="600" y="250" text-anchor="middle" class="serif" font-size="96" font-weight="400" letter-spacing="1" fill="#f2ece2">Ilia Farahani</text>

<!-- subtitle -->
<text x="600" y="300" text-anchor="middle" class="sans" font-size="21" font-weight="300" fill="#cabda3" font-style="italic">Engineering beneath the surface</text>

<rect x="560" y="332" width="80" height="1" fill="url(#hair)"/>

<!-- body line -->
<text x="600" y="382" text-anchor="middle" class="sans" font-size="15" fill="#8a7f6f">The API that stays predictable. The deployment you can repeat.</text>
<text x="600" y="406" text-anchor="middle" class="sans" font-size="15" fill="#8a7f6f">The code someone else can understand.</text>

<!-- three quiet marks -->
<g class="sans" font-size="12" letter-spacing="2" fill="#a58f66">
<text x="330" y="490" text-anchor="middle">BUILD</text>
<text x="600" y="490" text-anchor="middle">DEFEND</text>
<text x="870" y="490" text-anchor="middle">REFINE</text>
</g>
<circle cx="330" cy="470" r="2.5" fill="#c9a769"/>
<circle cx="600" cy="470" r="2.5" fill="#c9a769"/>
<circle cx="870" cy="470" r="2.5" fill="#c9a769"/>

<rect x="90" y="540" width="1020" height="1" fill="#3a3124"/>
<text x="600" y="572" text-anchor="middle" class="sans" font-size="11" letter-spacing="3" fill="#5f5646">HERE&#8211;IS&#8211;LEO.IR</text>
</svg>
