  <!-- ====== FALLBACK: اگه hero-content خالی موند ====== -->
  <script>
    (function() {
      // صبر کن تا همه چیز لود بشه
      setTimeout(function() {
        var hero = document.getElementById('hero-content');
        if (hero && hero.innerHTML.trim() === '') {
          console.log('⚠️ hero-content is empty! Using fallback...');
          hero.innerHTML = `
            <span class="eyebrow"><span class="pulse-dot"></span> در دسترس برای یادگیری و همکاری</span>
            <h1>سلام، من <span class="accent-name">ایلیا فراهانی</span> هستم</h1>
            <div class="typewriter"><span>برنامه‌نویس Python و C#</span><span class="cursor"></span></div>
            <p>برنامه‌نویسی و امنیت، دو روی یک سکه. با Python، C#، لینوکس و Kali، راه‌حل‌هایی می‌سازم که هم کارآمدند و هم امن.</p>
            <div class="hero-cta">
              <a href="#projects" class="btn btn-primary">مشاهده پروژه‌ها</a>
              <a href="about.html" class="btn btn-secondary">درباره من</a>
            </div>
          `;
          console.log('✅ Fallback hero rendered!');
        }
        
        // Stats fallback
        var statsGrid = document.getElementById('stats-grid');
        if (statsGrid && statsGrid.innerHTML.trim() === '') {
          statsGrid.innerHTML = `
            <div class="stat-card"><div class="number" data-count="35" data-suffix="+">0+</div><div class="label">چالش امنیتی حل شده</div></div>
            <div class="stat-card"><div class="number" data-count="113" data-suffix="">0</div><div class="label">مشارکت در یک سال</div></div>
            <div class="stat-card"><div class="number" data-count="10" data-suffix="">0</div><div class="label">پروژه عملی</div></div>
            <div class="stat-card"><div class="number" data-count="5" data-suffix="">0</div><div class="label">زبان برنامه‌نویسی</div></div>
          `;
        }
      }, 500);
    })();
  </script>
